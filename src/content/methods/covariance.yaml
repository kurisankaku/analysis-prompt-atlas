# src/content/methods/covariance.yaml
name: 共分散
reading: きょうぶんさん
english: Covariance
summary: 2つの数値が「一緒に増えたり減ったりする傾向」を、符号と大きさで表した指標。
oneLiner: 2つの数値が同じ方向に動くか逆に動くかを表す指標。相関係数のもとになる値。
analogy: 「気温が上がるとアイスも売れる」ように、片方が増えるともう片方も増える関係を数値にするイメージ。一緒に増えればプラス、逆に動けばマイナスになる。
whatYouLearn: 2つの数値が同じ方向に動くか（正）、逆方向に動くか（負）、ほとんど連動しないか（0付近）が分かる。関係の「向き」をつかむ第一歩になる。
suitableData:
  - 数値データを2列持つデータ（例：気温と来客数、勉強時間と点数）
suitablePurposes:
  - 2つの数値が連動する向き（正か負か）を知りたい
inputData: 1行が1件で、2列の数値（x と y）を持つデータ。各データの「平均からのズレ」を掛け合わせて平均する。
sampleTable:
  caption: 例：気温とアイスの売上（5日分）
  columns: ["日", "気温(℃)", "売上(個)"]
  rows:
    - ["1日目", "25", "40"]
    - ["2日目", "28", "55"]
    - ["3日目", "30", "60"]
    - ["4日目", "33", "75"]
    - ["5日目", "35", "85"]
sampleChart:
  type: scatter
  fit: true
  caption: x,yが一緒に増減＝正の共分散。
  x:
    label: 気温
    unit: ℃
  y:
    label: 売上
    unit: 個
  referenceLines:
    - axis: x
      value: 30.2
      label: 平均
      color: gold
    - axis: y
      value: 63
      label: 平均
      color: gold
  series:
    - label: 気温と売上
      points: [[25, 40], [28, 55], [30, 60], [33, 75], [35, 85]]
results: 連動の向きと大きさを表す1つの数値。この例ではプラスの大きな値になり、「気温が高い日ほど売上も多い」正の関係が読み取れる。
howToRead: 符号がプラスなら2つは一緒に増える正の関係、マイナスなら片方が増えるともう片方が減る負の関係、0付近なら連動はほとんどない。ただし値の大きさは元データの単位に左右されるため、「どれくらい強いか」は共分散だけでは比べられない。強さを比べたいときは相関係数を使う。
beforeAfter:
  before: 気温と売上の表を見ても、関連して動いているのか偶然なのか判断しづらい。
  after: 「共分散がプラス」と分かり、気温が高い日ほど売上も伸びる傾向が読み取れる。
whenToUse:
  - 2つの数値が同じ方向に動くか逆に動くか、向きを確認したいとき
  - 相関係数や回帰分析の計算の土台が必要なとき
whenNotToUse:
  - 関係の「強さ」を他のペアと比べたいとき（単位に左右されるため相関係数を使う）
  - 曲線的な関係を捉えたいとき（直線的な連動しか測れない）
cautions:
  - 値の大きさは単位（円・人・℃など）に依存し、そのままでは強弱を比較できない。相関係数に直すと比較できる。
  - 連動の向きを示すだけで、因果（原因→結果）は意味しない。第3の要因のこともある。
related:
  - id: correlation
    type: 比較対象
    note: 共分散を各データの標準偏差で割り、単位の影響をなくして強さを比較可能にしたもの。
  - id: simple-regression
    type: 発展
    note: 共分散をもとに関係を直線の式で表し、予測まで行うのが単回帰分析。
  - id: variance
    type: 類似
    note: 1変数の散らばりが分散、2変数の連動が共分散。同じ「平均からのズレ」を使う。
aiPromptExample: この2列の共分散を計算し、2つの数値が正・負どちらの向きに連動しているかを説明してください。強さは相関係数で確認すべき点も添えてください。
difficulty: 中級
tags: ["基礎統計", "関係性"]
keywords: ["共分散", "covariance", "関係性", "連動", "正負"]
purposeCategories: ["関係性を知りたい"]
dataCategories: ["数値データ"]
mathCategories: ["基礎統計"]
formula: 共分散(x, y) = {(x₁−x̄)(y₁−ȳ) + … + (xₙ−x̄)(yₙ−ȳ)} / n
