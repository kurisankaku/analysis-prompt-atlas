# src/content/methods/simple-regression.yaml
name: 単回帰分析
reading: たんかいきぶんせき
english: Simple Linear Regression
summary: 1つの原因（説明変数）から結果（目的変数）を予測する直線を引く手法。
oneLiner: 「Xが増えるとYはどれだけ変わるか」を1本の直線で表し、Yの値を予測する。
analogy: 気温（X）が上がるとアイスの売上（Y）も伸びる、という関係を1本の右肩上がりの直線で表すイメージ。気温を入れれば売上をおおよそ言い当てられる。
whatYouLearn: 2つの数値の関係を「Y ＝ 傾き × X ＋ 切片」という式で表せる。Xが1増えるとYがいくつ変わるか（傾き）が分かり、未知のXからYを予測できる。
suitableData:
  - 数値データ。原因と結果がともに数値で、直線的な関係が見込めるもの（気温と売上、広告費と来店数など）
suitablePurposes:
  - 2つの数値の関係を式にして予測したい
inputData: 2列の数値データ。1列がX（原因・説明変数）、もう1列がY（結果・目的変数）。1行が1件に対応する。
sampleTable:
  caption: 例：気温と1日のアイス売上
  columns: ["気温(℃)", "売上(個)"]
  rows:
    - ["20", "30"]
    - ["25", "55"]
    - ["28", "70"]
    - ["30", "85"]
    - ["33", "100"]
keyResults:
  - { label: 回帰式, value: "売上=5×気温−68", hint: 傾き5・切片−68 }
  - { label: 傾き, value: "5", unit: 個/℃, hint: 気温が1℃上がると売上+5個 }
sampleChart:
  type: scatter
  caption: データを貫く回帰直線で予測。R²は当てはまりの良さ。
  fit: true
  fitLabel: "売上 = a×気温 + b"
  x: { label: "気温", unit: "℃" }
  y: { label: "売上", unit: "個" }
  series:
    - label: 気温と売上
      points: [[20, 30], [25, 55], [28, 70], [30, 85], [33, 100]]
results: 「売上 ＝ 傾き × 気温 ＋ 切片」という予測式と、当てはまりの良さ（決定係数R²）。R²が1に近いほど直線がデータをよく説明している。
howToRead: 傾きが正なら「Xが増えるとYも増える」関係。傾きの大きさは「Xが1増えるとYがいくつ変わるか」。R²が高ければ予測の信頼度が高く、低ければ直線では説明しきれない。
beforeAfter:
  before: 気温と売上の点がバラバラに散らばっているだけで、関係を数値で言えない。
  after: 「気温が1℃上がると売上が約5個増える」と式で表せ、明日の気温から売上を予測できる。
whenToUse:
  - 1つの原因から結果を予測する式を作りたいとき
  - XとYの関係の強さ・向きを数値で示したいとき
whenNotToUse:
  - 結果に影響する原因が複数あるとき（重回帰分析を使う）
  - XとYの関係が直線ではなく曲線のとき
cautions:
  - 関係が直線でないと当てはまりが悪い。まず散布図で形を確認する。
  - 相関は因果ではない。式が引けても「XがYの原因」とは限らない。
  - 外れ値が1つあると直線が大きく傾く。
related:
  - id: correlation
    type: 前提
    note: 相関係数で直線関係の強さを確認してから回帰式を引くと安心。
  - id: scatter-plot
    type: 併用
    note: 散布図で点の散らばりと直線の当てはまりを目で確かめる。
  - id: multiple-regression
    type: 発展
    note: 原因が複数あるときは説明変数を増やした重回帰分析に進む。
aiPromptExample: このデータで単回帰分析を行い、予測式と決定係数R²を出して、関係の向き・強さと予測の信頼度を一言で説明してください。
derivation:
  intro: 単回帰は「データに一番フィットする直線」を1本引くこと。傾きと切片を、点と直線のズレ（誤差）が一番小さくなるように決める。
  symbols:
    - { sym: "\\hat{y}", meaning: "直線が予測するyの値（「ワイハット」と読む）" }
    - { sym: "a", meaning: "傾き（xが1増えるとyがいくつ変わるか）" }
    - { sym: "b", meaning: "切片（xが0のときのyの値）" }
    - { sym: "\\bar{x}", meaning: "xの平均（気温の平均）" }
    - { sym: "\\bar{y}", meaning: "yの平均（売上の平均）" }
  steps:
    - formula: "\\hat{y} = a x + b"
      explain: 予測したい直線の形。傾きaと切片bの2つを決めれば、気温xから売上yを予測できる。
      result: 求めたいのは傾きaと切片bの2つ
    - formula: "a = \\dfrac{\\mathrm{Cov}(x,y)}{\\mathrm{Var}(x)}"
      explain: "傾きaは「xとyが一緒に動く度合い（共分散）」を「xのばらつき（分散）」で割って求める。点と直線のズレの2乗の合計が最小になるよう選ばれる（最小二乗法）。"
      example: "a \\approx 5"
      result: 気温が1℃上がると売上は約5個増える
    - formula: "b = \\bar{y} - a \\bar{x}"
      explain: 切片bは、直線が必ずデータの平均点（x̄, ȳ）を通るように決める。平均値さえ分かれば計算できる。
      example: "b = 68 - 5 \\times 27.2 = -68"
      result: 予測式は「売上 ＝ 5×気温 − 68」
difficulty: 中級
tags: ["回帰分析", "予測", "解釈しやすい"]
keywords: ["単回帰分析", "simple regression", "linear regression", "回帰", "予測", "最小二乗法"]
purposeCategories: ["関係性を知りたい", "予測したい"]
dataCategories: ["数値データ"]
mathCategories: ["回帰分析"]
formula: Y = a·X + b （a：傾き、b：切片）
