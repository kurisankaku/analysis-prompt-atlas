# src/content/methods/correlation.yaml
name: 相関係数
reading: そうかんけいすう
english: Correlation Coefficient (Pearson)
summary: 2つの数値がどれくらい「一緒に動くか」を-1〜+1の1つの数値で表した指標。
oneLiner: 2つの数値の関係の強さと向きを-1〜+1の1値で表す指標。
analogy: 「気温が上がるとアイスが売れる」関係の強さを点数化するイメージ。きれいに連動すれば+1に近く、無関係なら0、逆に動けば-1に近づく。
whatYouLearn: 2つの数値の関係が強いか弱いか、正（一緒に増える）か負（片方が増えると片方が減る）かが、単位に左右されない1つの数値で分かる。
suitableData:
  - 数値データを2列持つデータ（例：広告費と売上、気温と来客数）
suitablePurposes:
  - 2つの数値の関係の強さと向きを数値で知りたい
inputData: 1行が1件で、2列の数値（x と y）を持つデータ。直線的な関係を測るのに向く。
sampleTable:
  caption: 例：広告費と売上（6日分）
  columns: ["日", "広告費(万円)", "売上(万円)"]
  rows:
    - ["1日目", "10", "120"]
    - ["2日目", "15", "150"]
    - ["3日目", "20", "165"]
    - ["4日目", "25", "200"]
    - ["5日目", "30", "210"]
    - ["6日目", "35", "250"]
sampleChart:
  type: scatter
  caption: 広告費と売上は強い正の相関（およそ+0.8）。
  series:
    - label: 広告費と売上
      points: [[10, 120], [15, 150], [20, 165], [25, 200], [30, 210], [35, 250]]
results: -1〜+1の数値。+1に近いほど強い正の関係、-1に近いほど強い負の関係、0付近なら直線的な関係はほぼない。
howToRead: 目安として絶対値0.7以上で強い、0.4〜0.7で中程度、0.2前後以下で弱い関係。符号が＋なら一緒に増える、−なら逆に動く。値が大きくても「直線的な」関係の強さを表すだけで、原因と結果は示さない。
beforeAfter:
  before: 散布図を見て「関係がありそう」とは思うが、強さを言葉でしか表せない。
  after: 「相関係数+0.8で強い正の関係」と客観的な数値で関係の強さを共有できる。
whenToUse:
  - 2つの数値の関係の強さを客観的な1つの数値で示したいとき
  - 多数の変数ペアから関係の強い組を絞り込みたいとき
whenNotToUse:
  - 曲線的な関係のとき（直線的な関係しか測れず過小評価する）
  - 関係から因果（原因→結果）を主張したいとき
cautions:
  - 相関は因果関係ではない。「相関がある＝一方が他方の原因」とは限らない（第3の要因や偶然のこともある）。
  - 直線的な関係しか捉えない。U字など曲線関係は0に近く出ることがある。
  - 外れ値1つで値が大きく変わることがあるため、必ず散布図と併せて見る。
related:
  - id: covariance
    type: 比較対象
    note: 共分散を各データのばらつきで割って単位の影響をなくしたものが相関係数。
  - id: scatter-plot
    type: 併用
    note: 散布図で関係の形を確認してから相関係数で強さを数値化すると誤解が減る。
  - id: simple-regression
    type: 発展
    note: 関係を直線の式にして予測まで行うのが単回帰。相関の次のステップ。
aiPromptExample: この2列の相関係数を計算し、関係の強さと向きを説明してください。あわせて相関は因果ではない点に注意して解釈してください。
difficulty: 初級
tags: ["基礎統計", "関係性", "解釈しやすい"]
keywords: ["相関係数", "correlation", "ピアソン", "相関", "関係性", "-1から1"]
purposeCategories: ["関係性を知りたい", "影響要因を知りたい"]
dataCategories: ["数値データ"]
mathCategories: ["基礎統計"]
formula: r = 共分散(x, y) / (xの標準偏差 × yの標準偏差)
