# src/content/methods/quartile.yaml
name: 四分位数
reading: しぶんいすう
english: Quartile
summary: データを小さい順に並べ、4等分する位置にある3つの値（第1・第2・第3四分位数）。
oneLiner: データを4等分する区切りの値。真ん中の値や散らばり具合を外れ値に強い形でつかめる。
analogy: 順番に並んだ行列を4つの同じ人数のグループに区切るイメージ。「下から4分の1の人」「真ん中の人」「上から4分の1の人」がそれぞれどの値かを見る。
whatYouLearn: データの真ん中（中央値）に加え、下位25％・上位25％の位置が分かる。3つの区切りから、データがどのあたりに密集し、どこまで広がっているかを外れ値に強い形でつかめる。
suitableData:
  - 数値データ（点数、価格、所要時間、年収など）。外れ値や偏りがあっても使える
suitablePurposes:
  - 外れ値に強い形でばらつき・散らばりを知りたい
inputData: 1列の数値が並んだデータ。1行が1件に対応する。内部で小さい順に並べ替えて区切りを求める。
sampleTable:
  caption: 例：11人の所要時間（分）を小さい順に並べたもの
  columns: ["順位", "所要時間(分)"]
  rows:
    - ["1〜3位", "10, 12, 15"]
    - ["4〜6位", "18, 20, 22"]
    - ["7〜9位", "25, 28, 30"]
    - ["10〜11位", "35, 60"]
sampleChart:
  type: boxplot
  caption: 箱の幅がIQR=四分位範囲（Q3−Q1）。真ん中50％の散らばりを外れ値に強く示す。
  y: { label: "所要時間", unit: "分" }
  boxes:
    - { label: "全体", min: 10, q1: 15, median: 22, q3: 30, max: 60, color: water }
results: 3つの区切り値（この例では第1四分位数15分・第2四分位数22分・第3四分位数30分）。第3と第1の差（四分位範囲＝15分）が真ん中50％の散らばり幅を表す。
howToRead: 第2四分位数は中央値そのもの。第1〜第3四分位数の間に全体の真ん中50％が入る。この幅（四分位範囲）が広いほど散らばっている。外れ値（この例の60分）があっても区切りの値はほとんど動かないため、実態に近い散らばりを示せる。
beforeAfter:
  before: 平均や最大・最小だけ見て、60分という外れ値に引きずられて散らばりを大きく見積もる。
  after: 「真ん中50％は15〜30分に収まる」と外れ値に左右されない散らばりを示せる。
whenToUse:
  - 外れ値や偏りがあるデータの散らばりを頑健に示したいとき
  - 箱ひげ図を描いて分布を要約・比較したいとき
whenNotToUse:
  - 件数が極端に少ないとき（区切りの値が安定しない）
  - すべてのデータを使った散らばり（標準偏差）が必要なとき
cautions:
  - 四分位数の計算方法には複数の流儀があり、ツールによって値が少しずれることがある。
  - 区切りの間の細かい分布の形までは分からない。形はヒストグラムや箱ひげ図で補う。
related:
  - id: boxplot
    type: 併用
    note: 四分位数をそのまま図にしたのが箱ひげ図。箱の上下端と中央線が四分位数。
  - id: median
    type: 併用
    note: 第2四分位数は中央値そのもの。中央値を散らばりまで拡張した指標。
  - id: std-dev
    type: 比較対象
    note: 全データを使う標準偏差に対し、四分位数は外れ値に強い散らばりの指標。
aiPromptExample: このデータの第1・第2・第3四分位数と四分位範囲を求め、真ん中50％がどの範囲に収まるかを説明してください。
derivation:
  intro: 四分位数は「小さい順に並べて4等分する区切りの値」。下から25%・50%・75%の位置を読み取る。ここでは11人の所要時間（分）で計算する。
  symbols:
    - { sym: "Q_1", meaning: "第1四分位数（下から25%の位置の値）" }
    - { sym: "Q_2", meaning: "第2四分位数（中央値・下から50%）" }
    - { sym: "Q_3", meaning: "第3四分位数（下から75%の位置の値）" }
    - { sym: "\\mathrm{IQR}", meaning: "四分位範囲（真ん中50%の幅）" }
  steps:
    - formula: "x_{(1)} \\le x_{(2)} \\le \\cdots \\le x_{(11)}"
      explain: まず小さい順に並べる。11個なので、ちょうど真ん中の6番目がQ2（中央値）になる。
      example: "10,\\,12,\\,15,\\,18,\\,20,\\,22,\\,25,\\,28,\\,30,\\,35,\\,60"
      result: 6番目の22がQ2＝中央値
    - formula: "Q_1 = x_{(3)},\\quad Q_3 = x_{(9)}"
      explain: 中央値で上下に分け、下half（前半）の真ん中がQ1、上half（後半）の真ん中がQ3。下半分10〜20の中央が15、上半分25〜60の中央が30。
      example: "Q_1 = 15,\\quad Q_2 = 22,\\quad Q_3 = 30"
      result: 区切りは15・22・30分
    - formula: "\\mathrm{IQR} = Q_3 - Q_1"
      explain: 第3四分位数から第1四分位数を引くと、真ん中50%が入る幅（四分位範囲）が出る。外れ値60分があっても、この幅はほとんど動かない。
      example: "\\mathrm{IQR} = 30 - 15 = 15"
      result: 真ん中50%は幅15分
difficulty: 初級
tags: ["基礎統計", "ばらつき", "ロバスト"]
keywords: ["四分位数", "quartile", "四分位範囲", "IQR", "ばらつき", "中央値"]
purposeCategories: ["ばらつきを知りたい"]
dataCategories: ["数値データ"]
mathCategories: ["基礎統計"]
formula: 第1四分位数=下位25%位置の値, 第2=中央値, 第3=上位25%位置の値（四分位範囲=第3−第1）
