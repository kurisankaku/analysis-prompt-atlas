# src/content/methods/variance.yaml
name: 分散
reading: ぶんさん
english: Variance
summary: データが平均からどれくらい散らばっているかを、平均との差を2乗して平均した値で表す指標。
oneLiner: データの「ばらつきの大きさ」を1つの数値で表す指標。値が大きいほど散らばっている。
analogy: クラス全員の点数が平均の周りにギュッと固まっているか、バラバラに広がっているかを数値にするイメージ。みんな似た点なら小さく、上下に大きく散らばるほど大きくなる。
whatYouLearn: データが平均の近くにまとまっているか、大きく散らばっているかが分かる。平均が同じでも、ばらつきの大小で「安定しているか」が見えてくる。
suitableData:
  - 数値データ（点数、売上、測定値、待ち時間など）
suitablePurposes:
  - データのばらつき・散らばりの大きさを知りたい
inputData: 1列の数値が並んだデータ。1行が1件（例：1人、1日、1商品）に対応する。
sampleTable:
  caption: 例：2クラスの小テスト点数（平均はどちらも60点）
  columns: ["クラス", "点数"]
  rows:
    - ["A組", "58, 60, 62, 59, 61"]
    - ["B組", "40, 60, 80, 50, 70"]
keyResults:
  - { label: A組の分散, value: "2", hint: ばらつき小 }
  - { label: B組の分散, value: "200", hint: 平均は同じ60点でも散らばり大 }
sampleChart:
  type: boxplot
  caption: 平均が同じでも箱の高さ＝ばらつきが違う。A組は揃い、B組は大きく散らばる。
  y: { label: "点数", unit: "点" }
  boxes:
    - { label: "A組（ばらつき小）", min: 58, q1: 59, median: 60, q3: 61, max: 62, color: water }
    - { label: "B組（ばらつき大）", min: 40, q1: 50, median: 60, q3: 70, max: 80, color: signal }
results: ばらつきを表す1つの数値（A組は約2、B組は約200）。平均が同じでもB組の方がはるかに散らばっていると分かる。
howToRead: 値が大きいほど平均から離れた値が多く、ばらつきが大きい。0なら全員が同じ値。ただし元データを2乗した単位（点なら「点²」）になるため、値そのものの大きさは直感的に解釈しにくい。実感に合う単位に戻すには標準偏差を使う。
beforeAfter:
  before: 平均だけ見て「どちらのクラスも60点で同じ」と思い、安定度の違いに気づけない。
  after: 「A組は点が揃い、B組は大きく散らばる」とばらつきの違いを数値で示せる。
whenToUse:
  - 平均が同じデータ同士で、どちらが安定している（ばらつきが小さい）か比べたいとき
  - 標準偏差や検定など、ばらつきを使う計算の土台が必要なとき
whenNotToUse:
  - ばらつきを元の単位のまま直感的に示したいとき（標準偏差の方が読みやすい）
  - 外れ値が多いとき（2乗するため極端な値の影響を強く受ける）
cautions:
  - 単位が元データの2乗になり、数値の大きさをそのまま解釈しづらい。標準偏差に直すと読みやすい。
  - 差を2乗するため、外れ値1つで大きく膨らむ。外れ値の有無を確認する。
related:
  - id: std-dev
    type: 発展
    note: 分散の平方根が標準偏差。元の単位に戻して解釈しやすくしたもの。
  - id: mean
    type: 前提
    note: 平均からの差をもとに計算するため、平均とセットで意味を持つ。
  - id: covariance
    type: 類似
    note: 1変数の散らばりが分散、2変数の連動が共分散。考え方が地続き。
aiPromptExample: このデータの分散を計算し、平均が同じ他のデータと比べてばらつきが大きいか小さいかを説明してください。
derivation:
  intro: 分散は「各データが平均からどれだけズレているか」を2乗してならした値。2乗するのはマイナスのズレを消して大きさだけを見るため。ここではA組（58,60,62,59,61・平均60）で計算する。
  symbols:
    - { sym: "x_i", meaning: "i番目のデータの値" }
    - { sym: "\\bar{x}", meaning: "平均（ここでは60点）" }
    - { sym: "n", meaning: "データの個数（ここでは5人）" }
    - { sym: "\\sigma^2", meaning: "分散（「シグマ2乗」と読む）" }
  steps:
    - formula: "x_i - \\bar{x}"
      explain: まず各値から平均を引く。これが「偏差」で、平均より上ならプラス、下ならマイナスになる。
      example: "58-60=-2,\\; 60-60=0,\\; 62-60=2,\\; 59-60=-1,\\; 61-60=1"
      result: 平均からのズレを出した
    - formula: "(x_i - \\bar{x})^2"
      explain: 偏差を2乗する。マイナスも2乗すればプラスになるので、上下どちらのズレも「大きさ」として足せるようになる。
      example: "(-2)^2=4,\\; 0^2=0,\\; 2^2=4,\\; (-1)^2=1,\\; 1^2=1"
      result: 2乗してズレの大きさにした
    - formula: "\\sigma^2 = \\dfrac{1}{n}\\sum_{i=1}^{n}(x_i - \\bar{x})^2"
      explain: 2乗した偏差を全部足して、個数で割る（＝平均する）。これが分散。
      example: "\\sigma^2 = \\dfrac{4+0+4+1+1}{5} = \\dfrac{10}{5} = 2"
      result: A組の分散は2
difficulty: 初級
tags: ["基礎統計", "ばらつき"]
keywords: ["分散", "variance", "ばらつき", "散らばり", "偏差平方"]
purposeCategories: ["ばらつきを知りたい"]
dataCategories: ["数値データ"]
mathCategories: ["基礎統計"]
formula: 分散 = {(x₁−平均)² + … + (xₙ−平均)²} / n
