# src/content/methods/deviation-value.yaml
name: 偏差値
reading: へんさち
english: Deviation Value (T-score)
summary: 各データが集団の中でどの位置にあるかを、平均50・標準偏差10になるよう変換した値。
oneLiner: 平均を50にそろえて「集団の中で上か下か」を表す指標。テストの偏差値でおなじみ。
analogy: テストの難易度が違っても比べられるよう、点数を「平均50点のものさし」に置き換えるイメージ。平均ちょうどなら50、平均より上なら50超え、下なら50未満。
whatYouLearn: ある値が集団の中で平均よりどれくらい上か下かが、テストの難易度や科目の違いに左右されず比較できる形で分かる。50が平均、60なら上位約16％、40なら下位約16％の目安。
suitableData:
  - 数値データ（テスト点数、評価スコアなど）。集団の中での相対的な位置を見たいもの
suitablePurposes:
  - 集団の中での相対的な順位・位置を比べたい
inputData: 1列の数値（個人ごとの値）と、その集団全体の平均・標準偏差。各値を相対位置の点数に変換する。
sampleTable:
  caption: 例：平均60点・標準偏差10点のテストでの偏差値
  columns: ["点数", "偏差値"]
  rows:
    - ["40点", "30"]
    - ["50点", "40"]
    - ["60点", "50"]
    - ["70点", "60"]
    - ["80点", "70"]
keyResults:
  - { label: 70点の偏差値, value: "60", hint: 平均より標準偏差1個分上 }
  - { label: 60点の偏差値, value: "50", hint: 平均ちょうど＝偏差値50 }
sampleChart:
  type: line
  caption: 点数が平均なら偏差値50。平均±標準偏差ごとに偏差値は10ずつ動く。
  x: { label: "点数", unit: "点" }
  y: { label: "偏差値" }
  series:
    - label: 偏差値
      color: signal
      points: [[40, 30], [50, 40], [60, 50], [70, 60], [80, 70]]
  referenceLines:
    - { axis: 'y', value: 50, label: "平均", color: gold }
  annotations:
    - { x: 70, y: 60, label: "偏差値60" }
results: 各データの相対位置を表す数値（平均ちょうどなら50）。点数が平均より標準偏差1つ分上なら偏差値60、1つ分下なら40になる。
howToRead: 50が集団の平均。50より大きいほど集団内で上位、小さいほど下位。釣鐘型の分布なら、偏差値60で上位約16％、70で上位約2％が目安。平均と標準偏差が違うテスト同士でも、偏差値なら同じものさしで比較できる。
beforeAfter:
  before: 「国語70点・数学65点」と言われても、難易度が違うのでどちらが良いか分からない。
  after: 「国語は偏差値55、数学は偏差値65」と分かり、集団の中では数学の方が上位と比べられる。
whenToUse:
  - 平均や難易度が異なるテスト・指標同士で相対的な位置を比べたいとき
  - 集団の中での順位感を直感的に共有したいとき
whenNotToUse:
  - 分布が釣鐘型から大きく外れるとき（上位何％の目安がずれる）
  - 人数が極端に少ない集団（平均・標準偏差が不安定で偏差値も揺れる）
cautions:
  - あくまで集団内の相対位置を示すもので、絶対的な学力や能力そのものを表すわけではない。
  - 「上位何％」の目安は左右対称の釣鐘型に近い分布が前提。歪んだ分布ではずれる。
related:
  - id: std-dev
    type: 前提
    note: 平均からのズレを標準偏差で割って計算するため、標準偏差の理解が前提。
  - id: mean
    type: 前提
    note: 集団の平均を基準（偏差値50）にするため、平均とセットで意味を持つ。
  - id: zscore
    type: 類似
    note: 同じ標準化の考え方。z-scoreを「平均50・標準偏差10」に直したのが偏差値。
aiPromptExample: この点数を、集団の平均と標準偏差をもとに偏差値へ変換し、集団の中での相対的な位置を説明してください。
codeExample:
  lang: python
  note: 標準ライブラリ statistics で平均・母標準偏差を求めて偏差値に変換。
  code: |
    import statistics

    scores = [40, 50, 60, 70, 80]       # 集団の点数（平均60・標準偏差10／このページの例データ）
    mean = statistics.mean(scores)      # 平均（基準＝偏差値50）
    sd = statistics.pstdev(scores)      # 母標準偏差
    x = 70                              # 偏差値を知りたい点数
    t = 50 + 10 * (x - mean) / sd       # 偏差値 = 50 + 10×(値−平均)/標準偏差
    print(t)                           # 60.0 → 答えカードの「70点の偏差値60」と一致
derivation:
  intro: 偏差値は「平均からのズレを標準偏差で測り、平均がちょうど50になるように直した値」。ここでは平均60点・標準偏差10点のテストで、70点の人を計算する。
  symbols:
    - { sym: "x", meaning: "変換したい値（ここでは70点）" }
    - { sym: "\\bar{x}", meaning: "集団の平均（ここでは60点）" }
    - { sym: "\\sigma", meaning: "標準偏差（ここでは10点）" }
    - { sym: "T", meaning: "偏差値（T-score）" }
  steps:
    - formula: "\\dfrac{x - \\bar{x}}{\\sigma}"
      explain: まず「平均から標準偏差いくつ分ずれているか」を出す。平均を引いて、標準偏差で割るだけ。
      example: "\\dfrac{70 - 60}{10} = 1"
      result: 平均より標準偏差1個分上
    - formula: "T = 50 + 10 \\times \\dfrac{x - \\bar{x}}{\\sigma}"
      explain: そのズレを10倍して50に足す。平均ちょうどなら50、標準偏差1個分上がるごとに偏差値は10ずつ増える。
      example: "T = 50 + 10 \\times 1 = 60"
      result: 70点は偏差値60
difficulty: 初級
tags: ["基礎統計", "ランキング", "標準化"]
keywords: ["偏差値", "deviation value", "T-score", "標準化", "相対評価", "順位"]
purposeCategories: ["ランキングしたい"]
dataCategories: ["数値データ"]
mathCategories: ["基礎統計", "ソート・ランキング"]
formula: 偏差値 = 50 + 10 × (値 − 平均) / 標準偏差
