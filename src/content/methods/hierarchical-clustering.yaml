# src/content/methods/hierarchical-clustering.yaml
name: 階層クラスタリング
reading: かいそうくらすたりんぐ
english: Hierarchical Clustering
summary: 近いデータ同士を少しずつまとめていき、グループの入れ子構造（木の形）として表す手法。
oneLiner: データを近い順に併合し、グループの階層を「木（デンドログラム）」で見せるクラスタリング。
analogy: 家系図を逆からたどるイメージ。まず一番近い2人をペアにし、次に近いペアやグループ同士をくっつけていくと、最後はみんなが1つの大きな木にまとまる。どの高さで枝を切るかで、グループの数を後から自由に決められる。
whatYouLearn: データがどんな「入れ子の構造」で似ているかが分かる。グループ数を事前に決めなくてよく、木の図を見てから「いくつに分けるか」を判断できる。
suitableData:
  - 数値データ（各件が複数の数値で表せるもの）
  - 多次元データ（特徴量が多数あるデータ）
suitablePurposes:
  - グループ数を決めずに、似たもの同士の構造を見つけたい
inputData: 1行が1件で、複数の数値列を持つデータ。件数が多すぎると計算が重くなるため、中小規模のデータに向く。
sampleTable:
  caption: 例：5商品の特徴（甘さと価格）
  columns: ["商品", "甘さ", "価格"]
  rows:
    - ["A", "8", "120"]
    - ["B", "7", "130"]
    - ["C", "2", "300"]
    - ["D", "3", "290"]
    - ["E", "5", "200"]
sampleChart:
  type: dendrogram
  caption: 似た者どうしを順に併合。切る高さでグループ数が決まる。
  y: { label: 距離（高さ） }
  leaves: [A, B, E, C, D]
  merges:
    - { a: A, b: B, height: 1.4 }
    - { a: C, b: D, height: 1.5 }
    - { a: 0, b: E, height: 3.5 }
    - { a: 2, b: 1, height: 8.0 }
  cut: 5.5
  cutLabel: ここで切ると2グループ
results: グループの併合の順番を表す木の図（デンドログラム）。木を好きな高さで切ると、その高さに応じたグループ数の分け方が得られる（例ではA・Bの甘い組とC・Dの高価な組などに分かれる）。
howToRead: 木の枝が低い位置でつながっているデータほど似ている。木を上の方で切ると大きく少数のグループに、下の方で切ると細かく多数のグループに分かれる。切る高さ＝グループ数の細かさを決める操作。
beforeAfter:
  before: いくつのグループに分けるべきか見当がつかず、分類の方針が決まらない。
  after: 木の図で似ている度合いを一目で確認し、「この高さで切れば3グループ」と根拠を持って決められる。
whenToUse:
  - グループ数を事前に決めたくない、または何個が妥当か探りたいとき
  - データ同士の似ている度合いの構造（入れ子関係）を見たいとき
whenNotToUse:
  - データ件数が非常に多いとき（計算量が大きく重くなる）
  - 最初からグループ数が決まっていて高速に分けたいとき（k-means が向く）
cautions:
  - 件数が増えると計算が急に重くなる。大規模データには不向き。
  - グループのまとめ方（最短距離法・ウォード法など）や距離の測り方で結果が変わる。
  - 一度くっつけた併合は後戻りしない。途中の併合が最終結果に影響する。
related:
  - id: kmeans
    type: 比較対象
    note: グループ数を先に決める k-means に対し、こちらは木を見て後から決められる。両者を見比べると安心。
  - id: pca
    type: 前処理
    note: 特徴量が多いとき PCA で次元を減らしてから使うと、距離計算が安定し木も見やすくなる。
aiPromptExample: このデータを階層クラスタリングでまとめ、デンドログラムをどの高さで切ると何グループになるかと、各グループの特徴を説明してください。
difficulty: 中級
tags: ["クラスタリング", "教師なし", "デンドログラム"]
keywords: ["階層クラスタリング", "hierarchical clustering", "デンドログラム", "クラスタリング", "グループ分け", "ウォード法", "教師なし学習"]
purposeCategories: ["グループ分けしたい", "構造を見つけたい"]
dataCategories: ["数値データ", "多次元データ"]
mathCategories: ["クラスタリング"]
formula: 最も近いデータ・グループの対を順に併合し、併合の高さを記録して木（デンドログラム）を構築する
