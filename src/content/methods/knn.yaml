# src/content/methods/knn.yaml
name: k近傍法
reading: けいきんぼうほう
english: k-Nearest Neighbors (k-NN)
summary: 似ているデータ（近くにあるk個）の多数決で、新しいデータを分類する手法。
oneLiner: 知りたいデータの「ご近所さんk人」を見て、その多数派と同じグループに分類する手法。
analogy: 引っ越し先の雰囲気を知るのに、最も近い数軒のお宅を見て「この辺はこういう感じ」と判断するイメージ。近い仲間の多数派に合わせる。
whatYouLearn: 新しいデータが、既存のどのグループに最も近いかが分かる。「近くにある似たデータの多数決」で分類でき、似ているもの探しにも使える。
suitableData:
  - 数値データ。各データを数値の座標として表せ、距離（近さ）が測れるもの
suitablePurposes:
  - 似ているデータを基準に新しいデータを分類したい
inputData: 数値の説明変数（複数列）と、既知データのクラス（ラベル）を持つデータ。新しいデータも同じ数値項目で表す。
sampleTable:
  caption: 例：果物の特徴と種類
  columns: ["重さ(g)", "甘さ(0-10)", "種類"]
  rows:
    - ["150", "7", "りんご"]
    - ["120", "9", "みかん"]
    - ["160", "6", "りんご"]
    - ["110", "8", "みかん"]
keyResults:
  - { label: 新データの分類, value: "りんご", hint: 近い3個の多数決 }
sampleChart:
  type: neighborhood
  caption: 新データに近いk個の多数決でクラスを決める。
  x: { label: 重さ, unit: g }
  y: { label: 甘さ, unit: 0-10 }
  k: 3
  query: { x: 140, y: 7 }
  points:
    - { x: 150, y: 7, cls: りんご, color: signal }
    - { x: 160, y: 6, cls: りんご, color: signal }
    - { x: 155, y: 5, cls: りんご, color: signal }
    - { x: 145, y: 6, cls: りんご, color: signal }
    - { x: 120, y: 9, cls: みかん, color: water }
    - { x: 110, y: 8, cls: みかん, color: water }
    - { x: 115, y: 9, cls: みかん, color: water }
    - { x: 125, y: 8, cls: みかん, color: water }
results: 新しいデータに最も近いk個の既知データを探し、その多数派のクラスを予測として返す。kは「何個のご近所を見るか」を決める設定値。
howToRead: 「最も近いk個のうち多数派がりんご→このデータもりんご」と読む。kが小さいとノイズに敏感、大きすぎると境界がぼやける。
beforeAfter:
  before: 新しい果物がりんごかみかんか、判断の基準がない。
  after: 「最も近い3個中2個がりんごだから、これはりんご」と近さを根拠に分類できる。
whenToUse:
  - 似たデータを基準に手早く分類したいとき
  - 学習に時間をかけず、その都度ご近所を探す手軽な方法が欲しいとき
whenNotToUse:
  - データ件数が非常に多いとき（毎回全件との距離計算が重い）
  - 変数の数が多く「近さ」が意味を持ちにくいとき（次元の呪い）
cautions:
  - 変数のスケールが揃っていないと距離が歪む。事前に標準化する。
  - kの値で結果が変わる。奇数にして多数決の引き分けを避けるとよい。
  - 予測のたびに全データとの距離を測るので、件数が多いと遅い。
related:
  - id: kmeans
    type: 比較対象
    note: kが付くが別物。k近傍は分類（正解あり）、k-meansはグループ分け（正解なし）。
  - id: cosine-similarity
    type: 併用
    note: 「近さ」の測り方として、距離の代わりにコサイン類似度を使うこともある。
  - id: decision-tree
    type: 比較対象
    note: 近い仲間で分けるか、ルールの枝分かれで分けるかという発想の違い。
aiPromptExample: このデータでk近傍法を使い、新しいデータを分類してください。事前に標準化し、適切なkも提案してください。
codeExample:
  lang: python
  note: scikit-learn の KNeighborsClassifier を使用。
  code: |
    from sklearn.neighbors import KNeighborsClassifier  # k近傍法の分類器
    # [重さ(g), 甘さ(0-10)]を特徴量に
    X = [[150, 7], [120, 9], [160, 6], [110, 8]]  # 例データの説明変数
    y = ["りんご", "みかん", "りんご", "みかん"]    # 既知データのクラス
    model = KNeighborsClassifier(n_neighbors=3).fit(X, y)  # 近い3個で多数決
    print(model.predict([[140, 7]])[0])           # りんご（答えカードと一致）
derivation:
  intro: k近傍法は「知りたいデータから近い順にk個のご近所を探し、その多数派と同じクラスにする」だけ。近さは2点間の距離で測る。
  symbols:
    - { sym: "d", meaning: "2点の間の距離（小さいほど近い＝似ている）" }
    - { sym: "(x_1, y_1)", meaning: "知りたい新データの座標（例：重さと甘さ）" }
    - { sym: "(x_2, y_2)", meaning: "比べる相手のデータの座標" }
    - { sym: "k", meaning: "多数決に使うご近所の数" }
  steps:
    - formula: "d = \\sqrt{(x_1-x_2)^2 + (y_1-y_2)^2}"
      explain: "各軸の差を2乗して足し、ルートをとる（三角形の斜辺の長さと同じ計算＝ユークリッド距離）。"
      example: "d = \\sqrt{(140-150)^2 + (7-7)^2} = \\sqrt{100} = 10"
      result: 新データ(140,7)と(150,7)の距離は10
    - formula: "\\hat{y} = mode(c_1, c_2, \\ldots, c_k)"
      explain: "全データとの距離を測り、小さい順にk個選ぶ。そのk個のクラス（c_1〜c_k）でいちばん多いクラスを答えにする。"
      example: "k = 3"
      result: 近い3個がすべてりんご→多数決でりんご
difficulty: 初級
