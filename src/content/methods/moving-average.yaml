# src/content/methods/moving-average.yaml
name: 移動平均
reading: いどうへいきん
english: Moving Average
summary: 時系列データを、一定期間ずつずらしながら平均を取って、短期的なギザギザをならし全体の流れを見やすくする手法。
oneLiner: 直近数件の平均を少しずつずらして計算し、データのデコボコをならして傾向を見やすくする手法。
analogy: 毎日の体重が食事や水分で上下するとき、「直近7日の平均」を見ると本当の増減の流れが分かる、というイメージ。1日ごとのブレに惑わされず、太り気味か痩せ気味かが見える。
whatYouLearn: 日々の細かな上下動（ノイズ）に隠れた、全体としての上昇・下降の傾向が見えるようになる。短期の偶然のブレを取り除いて流れを読める。
suitableData:
  - 時系列データ（日付や時刻の順に並んだ数値。例：日次の売上、株価、気温）
suitablePurposes:
  - 短期のブレをならして、傾向や変化の流れを見たい
inputData: 時間順に並んだ1列の数値データ。平均を取る期間（窓の幅。例：3日・7日）を自分で決める。
sampleTable:
  caption: 例：日次の売上と3日移動平均
  columns: ["日", "売上", "3日移動平均"]
  rows:
    - ["1日", "100", "-"]
    - ["2日", "120", "-"]
    - ["3日", "80", "100"]
    - ["4日", "140", "113"]
    - ["5日", "90", "103"]
    - ["6日", "160", "130"]
sampleChart:
  type: line
  caption: 元の売上（ギザギザ）と3日移動平均（なめらか）。
  series:
    - label: 元の売上
      points: [[1, 100], [2, 120], [3, 80], [4, 140], [5, 90], [6, 160]]
    - label: 3日移動平均
      points: [[3, 100], [4, 113], [5, 103], [6, 130]]
results: 元のデータより滑らかになった折れ線。日々のギザギザが消え、上昇傾向なのか下降傾向なのかが読み取りやすくなる。
howToRead: 移動平均の線が右肩上がりなら全体は増加傾向、右肩下がりなら減少傾向。窓を広く（例：7日→30日）すると、より滑らかになる反面、変化への反応が遅れる。
beforeAfter:
  before: 日々の売上がギザギザで、伸びているのか落ちているのか判断できない。
  after: 移動平均の滑らかな線で「全体としては緩やかに伸びている」と傾向をつかめる。
whenToUse:
  - 時系列データの短期的なブレを抑えて、傾向や流れを見たいとき
  - 季節や曜日の細かな変動をならして全体像を示したいとき
whenNotToUse:
  - 急な変化やピークそのものを正確に捉えたいとき（ならされて鈍る）
  - 時間順でないデータのとき（移動平均は順序が前提）
cautions:
  - 窓を広げるほど滑らかになるが、変化の検知が遅れる（反応が遅くなる）。
  - 最初の数件は平均が計算できず、データの端が欠ける。
  - あくまで過去のならしであり、未来を保証する予測ではない。急変は捉えにくい。
related:
  - id: mean
    type: 類似
    note: 移動平均は「区間を区切って平均を繰り返す」もの。平均の考え方を時系列に応用したもの。
  - id: std-dev
    type: 併用
    note: ならした傾向に加え、ばらつきの大きさも見ると変動の激しさが分かる。
aiPromptExample: この時系列データの3日移動平均と7日移動平均を計算し、全体の傾向（上昇か下降か）を説明してください。
difficulty: 初級
tags: ["時系列", "傾向", "平滑化"]
keywords: ["移動平均", "moving average", "時系列", "平滑化", "トレンド", "ならし"]
purposeCategories: ["変化を見つけたい", "傾向を知りたい", "予測したい"]
dataCategories: ["時系列データ"]
mathCategories: ["時系列解析"]
formula: 移動平均（窓幅n） = 直近n件の値の合計 ÷ n（1件ずつずらして繰り返す）
