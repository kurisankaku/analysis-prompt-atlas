# src/content/methods/mode.yaml
name: 最頻値
reading: さいひんち
english: Mode
summary: データの中で最も多く出てくる値（いちばん頻度が高いもの）。
oneLiner: いちばん「よく出る」値。数字でもカテゴリでも使える代表値。
analogy: アンケートで「いちばん人気の回答」を見るイメージ。お店で最も売れたサイズや色が「定番」になるのと同じ。
whatYouLearn: データの中で最もありふれた値・典型的な選択肢が分かる。平均や中央値が出せないカテゴリデータでも「いちばん多いもの」を示せる。
suitableData:
  - 数値データ（よく出る値を知りたいとき）
  - カテゴリデータ（色・サイズ・回答区分など）
suitablePurposes:
  - 最も多い値・人気の選択肢を知りたい
inputData: 1列の値が並んだデータ。数値でもカテゴリ（文字）でもよい。1行が1件に対応する。
sampleTable:
  caption: 例：販売したTシャツのサイズ
  columns: ["注文", "サイズ"]
  rows:
    - ["1", "M"]
    - ["2", "L"]
    - ["3", "M"]
    - ["4", "S"]
    - ["5", "M"]
keyResults:
  - { label: 最頻値, value: "M", hint: 3着で最多 }
sampleChart:
  type: bar
  caption: 最も多いサイズ（最頻値）。Mが3着で一番売れている。
  x: { label: "サイズ" }
  y: { label: "販売数", unit: "着" }
  categories: ["S", "M", "L"]
  series:
    - label: 販売数
      color: signal
      points: [[1, 1], [2, 3], [3, 1]]
  annotations:
    - { x: 2, y: 3, label: "最頻値", place: 'top' }
results: 最も多く現れた値（この例ではサイズM、3着）。「いちばん定番」が一目で分かる。
howToRead: 最頻値Mなら「最も売れたのはMサイズ」。複数の値が同数で並ぶこともあり、その場合は最頻値が複数になる（多峰）。件数が少ないと偶然で決まりやすい。
beforeAfter:
  before: サイズがバラバラに記録されているだけで、何が定番か分からない。
  after: 「いちばん売れたのはM」と分かり、仕入れや陳列の判断に使える。
whenToUse:
  - カテゴリデータで最も多い区分を知りたいとき
  - 「典型的な値・定番」を一言で示したいとき
whenNotToUse:
  - すべての値がほぼ同じ回数しか出ないとき（最頻値が意味を持たない）
  - 連続的な数値で同じ値がほとんど重ならないとき（階級にまとめる必要がある）
cautions:
  - 同じ頻度の値が複数あると最頻値が一つに定まらない。
  - 件数が少ないと偶然で決まり、安定しない。
related:
  - id: mean
    type: 比較対象
    note: 数値データの代表値。最頻値・中央値と見比べると分布の形が分かる。
  - id: median
    type: 比較対象
    note: 真ん中の値。最頻値とズレていれば分布が偏っているサイン。
  - id: histogram
    type: 併用
    note: 度数分布を図にすると、どの値が最頻値かが直感的に分かる。
aiPromptExample: このデータの最頻値（いちばん多い値）を求め、平均・中央値との違いから分布の特徴を説明してください。
derivation:
  intro: 最頻値は「それぞれの値が何回出たかを数えて、いちばん回数が多い値を選ぶ」だけ。
  symbols:
    - { sym: "f(x)", meaning: "値xの度数（=xが出てきた回数）" }
    - { sym: "\\mathrm{Mode}", meaning: "最頻値（モード）" }
    - { sym: "\\arg\\max", meaning: "「いちばん大きくする値」を選ぶ記号" }
  steps:
    - formula: "f(S),\\; f(M),\\; f(L)"
      explain: まず値ごとに出現回数（度数）を数える。表をなぞって、同じ値が何回あるかを集計するだけ。
      example: "f(S)=1,\\; f(M)=3,\\; f(L)=1"
      result: Mが3回でいちばん多い
    - formula: "\\mathrm{Mode} = \\arg\\max_{x} f(x)"
      explain: 度数f(x)がいちばん大きくなる値xを選ぶ。これが「最もよく出る値」＝最頻値。
      example: "\\mathrm{Mode} = \\arg\\max\\{1, 3, 1\\} = M"
      result: 最頻値はサイズM
difficulty: 基礎
tags: ["基礎統計", "解釈しやすい", "カテゴリ対応"]
keywords: ["最頻値", "mode", "代表値", "頻度", "人気"]
purposeCategories: ["傾向を知りたい", "要約したい"]
dataCategories: ["数値データ", "カテゴリデータ"]
mathCategories: ["基礎統計"]
formula: 最頻値 = 度数（出現回数）が最大となる値
