# src/content/methods/t-test.yaml
name: t検定
reading: てぃーけんてい
english: t-test
summary: 2つのグループの平均の差が「たまたま」なのか「意味のある差」なのかを統計的に判定する手法。
oneLiner: 2グループの平均の差が偶然とは言えないかを確かめる検定。
analogy: 新しい教え方と従来の教え方で平均点が5点違ったとき、「本当に効果があるのか、たまたまか」を見極めるイメージ。少人数で差が小さいほど「偶然かも」と慎重になる。
whatYouLearn: 2つのグループの平均の差が、偶然のばらつきで説明できる範囲か、それを超えた意味のある差かが分かる。
suitableData:
  - 数値データ。2つのグループに分かれた測定値（例：A群とB群の点数）
suitablePurposes:
  - 2グループの平均に意味のある差があるかを知りたい
inputData: グループを区別する列と、測定値の数値列。例：「グループ」列（AかB）と「点数」列。各群ある程度の件数が必要。
sampleTable:
  caption: 例：2つの教え方による点数（抜粋）
  columns: ["グループ", "点数"]
  rows:
    - ["A（新方式）", "82"]
    - ["A（新方式）", "78"]
    - ["A（新方式）", "85"]
    - ["B（従来）", "74"]
    - ["B（従来）", "70"]
    - ["B（従来）", "76"]
keyResults:
  - { label: 平均の差, value: "約8点", hint: A群81.7 − B群73.3 }
  - { label: 判定, value: "有意差あり", hint: p<0.05 }
sampleChart:
  type: boxplot
  caption: 2群の中央値差が偶然か検定（重なり具合に注目）。
  y: { label: "点数", unit: "点" }
  boxes:
    - { label: "A群", min: 76, q1: 78, median: 82, q3: 85, max: 88, color: water }
    - { label: "B群", min: 68, q1: 70, median: 74, q3: 76, max: 80, color: signal }
results: t値とp値。p値が小さい（一般に0.05未満）ほど「平均の差は偶然とは言いにくい＝意味のある差」と判断する。
howToRead: p値が0.05未満なら「平均の差は統計的に有意（偶然では説明しにくい）」。0.05以上なら「差があるとは言い切れない」。ただしp値は差の大きさそのものではないので、平均の差の実際の大きさも併せて見る。
beforeAfter:
  before: 「A群の方が平均5点高い」と分かっても、それが本物の差か偶然か判断できない。
  after: 「p<0.05でこの差は偶然とは言いにくい」と根拠を持って結論できる。
whenToUse:
  - 2グループの平均に意味のある差があるかを検証したいとき
  - A/Bテストなどで施策の効果を判定したいとき
whenNotToUse:
  - 3グループ以上を一度に比べたいとき（分散分析などが適切）
  - 比べたいのがカテゴリの割合のとき（カイ二乗検定が適切）
cautions:
  - p値は「差の大きさ」ではない。件数が多いと小さな差でも有意になりやすい。
  - 有意でも実務的に意味があるとは限らない。差の大きさ（効果量）も確認する。
  - データが極端に偏っている・外れ値が多い場合は前提が崩れることがある。
related:
  - id: chi-squared
    type: 比較対象
    note: t検定は数値の平均を、カイ二乗検定はカテゴリの割合を比べる。対象が異なる。
  - id: mean
    type: 前提
    note: t検定は2グループの平均の差を扱う。平均の理解が前提になる。
  - id: std-dev
    type: 補完
    note: 各グループのばらつき（標準偏差）が差の判定に影響する。併せて確認する。
aiPromptExample: この2グループの点数にt検定を行い、平均の差が統計的に有意か（p値）と、差の大きさを分かりやすく説明してください。
derivation:
  intro: t検定は「2つのグループの平均の差」を「ばらつき（誤差）」で割るだけ。差がばらつきに比べて大きいほど、偶然とは言いにくくなる。
  symbols:
    - { sym: "\\bar{x}_A", meaning: "A群の平均（ここでは新方式の点数の平均）" }
    - { sym: "\\bar{x}_B", meaning: "B群の平均（ここでは従来の点数の平均）" }
    - { sym: "SE", meaning: "標準誤差（平均がどれくらいブレるかの目安）" }
    - { sym: "t", meaning: "平均の差をばらつきで割った値（大きいほど差が際立つ）" }
  steps:
    - formula: "\\bar{x}_A = \\dfrac{x_1 + x_2 + x_3}{3}"
      explain: まず各グループの平均を出す。A群もB群も「全部足して個数で割る」だけ。
      example: "\\bar{x}_A = \\dfrac{82 + 78 + 85}{3} \\approx 81.7,\\quad \\bar{x}_B = \\dfrac{74 + 70 + 76}{3} = 73.3"
      result: A群の平均は約81.7点、B群は約73.3点
    - formula: "t = \\dfrac{\\bar{x}_A - \\bar{x}_B}{SE}"
      explain: 平均の差を、平均自体のばらつき（標準誤差SE）で割る。差が大きく、ばらつきが小さいほどtは大きくなる。
      example: "t = \\dfrac{81.7 - 73.3}{SE} = \\dfrac{8.4}{SE}"
      result: 平均差8.4点を「ばらつき」で割って差の際立ち具合を測る
    - formula: "p = P(\\,|T| \\geq |t|\\,)"
      explain: tの大きさから「これほどの差が偶然で起きる確率（p値）」を求める。p値が0.05より小さければ「偶然とは言いにくい＝意味のある差」と判断する。
      result: p<0.05なら平均の差は統計的に有意
difficulty: 中級
tags: ["統計的検定", "仮説検定", "2群比較"]
keywords: ["t検定", "t-test", "仮説検定", "p値", "有意差", "平均の差"]
purposeCategories: ["関係性を知りたい"]
dataCategories: ["数値データ"]
mathCategories: ["統計的検定"]
