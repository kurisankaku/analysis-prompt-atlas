# src/content/methods/histogram.yaml
name: ヒストグラム
reading: ひすとぐらむ
english: Histogram
summary: 数値データをいくつかの区間（階級）に分け、各区間に入る件数を棒の高さで表したグラフ。
oneLiner: 数値が「どのあたりにどれくらい集まっているか」を棒の高さで見える化する図。
analogy: テストの点を「0〜20点」「20〜40点」…と箱に仕分けし、箱ごとに人数を積み上げるイメージ。どの点数帯に人が多いか一目で分かる。
whatYouLearn: データがどの値の周りに集まり、どこまで広がっているかという「分布の形」が分かる。山が1つか2つか、左右に偏っているか、外れ値があるかが見える。
suitableData:
  - 数値データ（点数、年齢、金額、待ち時間など）。ある程度件数があるもの
suitablePurposes:
  - データ全体の分布の形・ばらつきを知りたい
inputData: 1列の数値が並んだデータ。1行が1件（例：1人、1取引）に対応する。件数は数十件以上あると形が見やすい。
sampleTable:
  caption: 例：30人のテスト点数を10点刻みで集計
  columns: ["点数の階級", "人数"]
  rows:
    - ["50〜60点", "2"]
    - ["60〜70点", "5"]
    - ["70〜80点", "12"]
    - ["80〜90点", "8"]
    - ["90〜100点", "3"]
keyResults:
  - { label: 最多の階級, value: "70〜80点", hint: 12人 }
  - { label: 中心の目安, value: "75", unit: 点, hint: 階級の中央 }
sampleChart:
  type: histogram
  caption: 階級ごとの人数。70〜80に山。
  x:
    label: 点数
    unit: 点
  y:
    label: 人数
    unit: 人
  referenceLines:
    - axis: x
      value: 75
      label: 中心
      color: gold
  series:
    - label: 人数
      points: [[55, 2], [65, 5], [75, 12], [85, 8], [95, 3]]
results: 階級ごとの件数を示す棒グラフ。最も件数が多い階級（この例では70〜80点）が分布の山になる。
howToRead: 棒が高いところに人（データ）が多い。山が中央なら平均的な値に集中、山が左右どちらかに寄っていれば偏った分布。山が2つあれば性質の違う2集団が混ざっているサイン。離れた位置の小さな棒は外れ値の可能性。
beforeAfter:
  before: 数百件の数値が並んだ表を見ても、どこに集まっているのか分からない。
  after: 「70〜80点が一番多く、全体は左右に広がる山型」と分布の形が一目で分かる。
whenToUse:
  - データ全体のばらつきや分布の形をつかみたいとき
  - 平均だけでは見えない偏りや外れ値、二山構造を確認したいとき
whenNotToUse:
  - 件数が極端に少ないとき（数件では形が安定しない）
  - カテゴリデータの集計をしたいとき（その場合は棒グラフを使う）
cautions:
  - 階級の幅（区切り方）で印象が変わる。幅を変えて複数試すとよい。
  - 件数が少ないとガタガタした形になり、本来の分布を読み違えやすい。
related:
  - id: boxplot
    type: 併用
    note: ヒストグラムで分布の形を、箱ひげ図で要約をつかむと相互補完できる。
  - id: std-dev
    type: 併用
    note: 標準偏差で広がりを数値化すると、ヒストグラムの見た目を裏づけられる。
  - id: mean
    type: 補完
    note: 山の位置（中心）を平均で数値化すると、分布の中心が明確になる。
aiPromptExample: このデータを適切な階級幅でヒストグラムにし、分布の形（山の数・偏り・外れ値）を一言で説明してください。
derivation:
  intro: ヒストグラムの棒の高さは「その階級に何件入ったか（度数）」。全体に占める割合を見たいときは度数を全体の件数で割って相対度数にする。
  symbols:
    - { sym: "f_k", meaning: "k番目の階級の度数（人数）" }
    - { sym: "n", meaning: "データ全体の件数" }
    - { sym: "r_k", meaning: "k番目の階級の相対度数（割合）" }
  steps:
    - formula: "n = f_1 + f_2 + \\cdots + f_K"
      explain: まず各階級の度数を全部足して、全体の件数を求める。
      example: "n = 2 + 5 + 12 + 8 + 3 = 30"
      result: 全体は30人
    - formula: "r_k = \\dfrac{f_k}{n}"
      explain: 注目する階級の度数を全体の件数で割ると、その階級が占める割合になる。
      example: "r = \\dfrac{12}{30} = 0.4"
      result: 70〜80点の階級が全体の40%
difficulty: 基礎
tags: ["基礎統計", "可視化", "解釈しやすい"]
keywords: ["ヒストグラム", "histogram", "度数分布", "分布", "階級", "ばらつき"]
purposeCategories: ["傾向を知りたい", "ばらつきを知りたい"]
dataCategories: ["数値データ"]
mathCategories: ["基礎統計"]
