# src/content/methods/mean.yaml
name: 平均
reading: へいきん
english: Mean (Arithmetic Mean)
summary: 数値データをすべて足して個数で割った、データ全体を代表する1つの値。
oneLiner: データ全体を「ならすと1個あたりどれくらいか」を表す代表値。
analogy: クラス全員のテスト点を合計して人数で割ると平均点が出る。みんなの点を平らに均（なら）すといくつになるか、というイメージ。
whatYouLearn: データ全体の中心的な水準が分かる。「だいたいこのくらい」という基準値が得られ、他の期間やグループと比較する土台になる。
suitableData:
  - 数値データ（売上、点数、回数、金額など）
suitablePurposes:
  - 全体の傾向・代表値を知りたい
inputData: 1列の数値が並んだデータ。1行が1件（例：1人、1日、1商品）に対応する。
sampleTable:
  caption: 例：5人の小テストの点数
  columns: ["生徒", "点数"]
  rows:
    - ["Aさん", "60"]
    - ["Bさん", "70"]
    - ["Cさん", "80"]
    - ["Dさん", "90"]
    - ["Eさん", "100"]
keyResults:
  - { label: 平均, value: "80", unit: 点, hint: 合計400 ÷ 5人 }
sampleChart:
  type: bar
  caption: 5人の点数。棒の高さが各点、黄色の線が平均。
  x: { label: "生徒" }
  y: { label: "点数", unit: "点" }
  categories: ["Aさん", "Bさん", "Cさん", "Dさん", "Eさん"]
  series:
    - label: 点数
      color: signal
      points: [[1, 60], [2, 70], [3, 80], [4, 90], [5, 100]]
  referenceLines:
    - { axis: 'y', value: 80, label: "平均", color: gold, dashed: true }
results: データ全体を代表する1つの数値（この例では80点）。全体としてどのくらいの水準かを一言で表せる。
howToRead: 平均80点なら「全体の中心はおよそ80点」。ただし全員が80点という意味ではなく、低い人も高い人もいる。極端な値があると平均はそちらに引っ張られる。
beforeAfter:
  before: 点数がバラバラに並んでいるだけで、全体としての水準がつかめない。
  after: 「全体の中心は約80点」と一言で言え、他クラスや前回との比較ができる。
whenToUse:
  - データ全体のおおまかな水準を一言で示したいとき
  - 複数のグループや期間を同じ土俵で比較したいとき
whenNotToUse:
  - 極端に大きい/小さい値（外れ値）が混じるとき。中央値の方が実態に近い。
  - 一部に極端に偏った分布のとき
cautions:
  - 外れ値に弱い。1つの極端な値で平均が大きく動く。
  - 「平均＝典型的な1件」ではない。ばらつき（標準偏差など）も併せて見る。
related:
  - id: median
    type: 比較対象
    note: 外れ値に強い代表値。平均と併せて見ると分布の偏りが分かる。
aiPromptExample: このデータの平均を計算し、全体の水準を一言でまとめてください。外れ値の影響があれば指摘してください。
derivation:
  intro: 平均は「全部を合計して、個数で割る」だけ。記号に置きかえても、やっていることは同じ。
  symbols:
    - { sym: "x_i", meaning: "i番目のデータの値（例：3人目の点数）" }
    - { sym: "n", meaning: "データの個数（ここでは5人）" }
    - { sym: "\\bar{x}", meaning: "平均（「エックスバー」と読む）" }
    - { sym: "\\sum", meaning: "「全部を足す」という記号（シグマ）" }
  steps:
    - formula: "\\bar{x} = \\dfrac{x_1 + x_2 + \\cdots + x_n}{n}"
      explain: すべての値を1つずつ足し、その合計をデータの個数で割る。これが平均の定義そのもの。
      example: "\\bar{x} = \\dfrac{60 + 70 + 80 + 90 + 100}{5}"
      result: まず分子に合計、分母に個数を置く
    - formula: "\\bar{x} = \\dfrac{1}{n}\\sum_{i=1}^{n} x_i"
      explain: "「x_1 + … + x_n」を短く書くとシグマ記号になる。長い足し算の省略形なので意味は変わらない。"
      example: "\\bar{x} = \\dfrac{400}{5} = 80"
      result: 平均は80点
difficulty: 基礎
tags: ["基礎統計", "解釈しやすい"]
keywords: ["平均", "mean", "average", "代表値", "算術平均"]
purposeCategories: ["傾向を知りたい", "要約したい"]
dataCategories: ["数値データ"]
mathCategories: ["基礎統計"]
formula: 平均 = (x₁ + x₂ + … + xₙ) / n
