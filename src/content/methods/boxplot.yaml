# src/content/methods/boxplot.yaml
name: 箱ひげ図
reading: はこひげず
english: Box Plot (Box-and-Whisker Plot)
summary: データの最小値・四分位数・中央値・最大値を、箱とひげの形で1つにまとめて表したグラフ。
oneLiner: データのばらつきと中心、外れ値を「箱とひげ」でコンパクトに見せる図。
analogy: クラスの点数を「下から数えて真ん中の人」「上位4分の1の人」などの目印で区切り、その範囲を箱で描くイメージ。箱が大きいほどバラつきが大きい。
whatYouLearn: データの中心（中央値）、真ん中50%が収まる範囲（箱の高さ）、全体の広がり（ひげ）、外れ値が一目で分かる。複数グループのばらつきを並べて比べやすい。
suitableData:
  - 数値データ（点数、価格、待ち時間など）。グループ別の比較にも向く
suitablePurposes:
  - データのばらつきや外れ値を要約して把握したい
inputData: 1列の数値データ。グループ別に比べる場合は「グループ名」列と「数値」列の2列構成。
sampleTable:
  caption: 例：あるテスト点数の5数要約
  columns: ["指標", "値"]
  rows:
    - ["最小値", "40"]
    - ["第1四分位数", "62"]
    - ["中央値", "75"]
    - ["第3四分位数", "85"]
    - ["最大値", "98"]
keyResults:
  - { label: 中央値, value: "75", unit: 点, hint: 真ん中の人の点 }
  - { label: 四分位範囲(IQR), value: "23", unit: 点, hint: 85 − 62 }
sampleChart:
  type: boxplot
  caption: 箱が真ん中50%、中の線が中央値、ひげが全体の広がり。
  y:
    label: 点数
    unit: 点
  boxes:
    - label: テスト点数
      min: 40
      q1: 62
      median: 75
      q3: 85
      max: 98
results: 最小・第1四分位・中央値・第3四分位・最大値の「5数要約」を箱とひげで表現。箱の中の線が中央値、箱の上下端が四分位数。
howToRead: 箱の中の線が中央値で代表的な水準。箱の高さ（四分位範囲）が大きいほど真ん中50%のばらつきが大きい。ひげの外に飛び出した点は外れ値。中央値が箱の中央からずれていれば分布が偏っている。
beforeAfter:
  before: グループごとの点数がバラバラで、どこがばらついているか比べられない。
  after: 箱の大きさと位置を見比べ、「Bクラスは中央値が高くばらつきも小さい」と要約できる。
whenToUse:
  - 複数グループのばらつきや水準をコンパクトに比較したいとき
  - 外れ値の有無をすばやく確認したいとき
whenNotToUse:
  - 分布の細かい形（山が2つあるかなど）を見たいとき（ヒストグラムが適切）
  - データ件数が極端に少ないとき（四分位数が安定しない）
cautions:
  - 山が2つある分布などは箱ひげ図では見抜けない。ヒストグラムと併用する。
  - 外れ値の判定基準（ひげの伸ばし方）は流儀により異なるので定義を確認する。
related:
  - id: quartile
    type: 前提
    note: 箱ひげ図は四分位数を図にしたもの。四分位数の理解が土台になる。
  - id: histogram
    type: 併用
    note: 箱ひげ図で要約、ヒストグラムで分布の形を見ると死角が減る。
  - id: median
    type: 補完
    note: 箱の中の線は中央値。代表値として併せて読むと理解が深まる。
aiPromptExample: このデータをグループ別の箱ひげ図にまとめ、中央値・ばらつき・外れ値の違いを一言で比較してください。
codeExample:
  lang: python
  note: numpy で5数要約を計算し、matplotlib で描画。
  code: |
    import numpy as np                                   # 5数要約の計算用
    import matplotlib.pyplot as plt                      # 描画用
    data = [40, 62, 75, 85, 98]                          # このページの例（5数要約に対応する点数）
    mn, q1, med, q3, mx = np.percentile(data, [0, 25, 50, 75, 100])  # 最小・Q1・中央値・Q3・最大
    plt.boxplot(data)                                    # 箱ひげ図を描画
    print(f"中央値={med:.0f} IQR={q3 - q1:.0f}")          # 中央値=75 IQR=23 → 答えカードと一致
derivation:
  intro: 箱ひげ図は5つの数（最小・Q1・中央値・Q3・最大）で描く。箱の高さ（四分位範囲IQR）と、その1.5倍を使って外れ値の境目を決める。
  symbols:
    - { sym: "Q_1", meaning: "第1四分位数（下から1/4の位置）" }
    - { sym: "Q_3", meaning: "第3四分位数（下から3/4の位置）" }
    - { sym: "IQR", meaning: "四分位範囲（箱の高さ）" }
  steps:
    - formula: "IQR = Q_3 - Q_1"
      explain: 箱の上端から下端を引くと、真ん中50%が収まる範囲（箱の高さ）になる。
      example: "IQR = 85 - 62 = 23"
      result: 箱の高さは23点
    - formula: "Q_1 - 1.5 \\times IQR"
      explain: 箱の下端からIQRの1.5倍だけ下がった所が、外れ値とみなす下の境目。
      example: "62 - 1.5 \\times 23 = 27.5"
      result: 27.5点より下は外れ値の目安
    - formula: "Q_3 + 1.5 \\times IQR"
      explain: 箱の上端からIQRの1.5倍だけ上がった所が、外れ値とみなす上の境目。
      example: "85 + 1.5 \\times 23 = 119.5"
      result: 119.5点より上は外れ値の目安（最大98は範囲内）
difficulty: 初級
tags: ["基礎統計", "可視化", "ばらつき", "外れ値検出"]
keywords: ["箱ひげ図", "boxplot", "box plot", "五数要約", "四分位範囲", "外れ値"]
purposeCategories: ["ばらつきを知りたい"]
dataCategories: ["数値データ"]
mathCategories: ["基礎統計"]
