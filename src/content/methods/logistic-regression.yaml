# src/content/methods/logistic-regression.yaml
name: ロジスティック回帰
reading: ろじすてぃっくかいき
english: Logistic Regression
summary: 複数の要因から「起こる/起こらない」の確率を予測し、2つのグループに分類する手法。
oneLiner: 数値ではなく「YESの確率（0〜100%）」を予測し、その確率で2クラスに分ける分類手法。
analogy: 健康診断の数値からその人が「病気かどうか」を、白黒ではなく「病気の確率70%」のように出すイメージ。確率が高ければ「病気あり」と判定する。
whatYouLearn: 各要因が「YESになりやすさ」をどれだけ上げ下げするか、そして個々のケースが該当する確率が分かる。確率にしきい値（例：50%）を設けて2クラスに分類できる。
suitableData:
  - 数値データ。結果が「合格/不合格」「購入する/しない」など2択（2値）のもの
suitablePurposes:
  - 要因から「起こる確率」を出して2グループに分類したい
inputData: 説明変数（数値の列が1つ以上）と、0/1で表す2値の目的変数を持つデータ。1行が1件に対応する。
sampleTable:
  caption: 例：勉強時間と合否
  columns: ["勉強時間(h)", "合否(1=合格)"]
  rows:
    - ["1", "0"]
    - ["3", "0"]
    - ["5", "1"]
    - ["8", "1"]
keyResults:
  - { label: 勉強5時間の合格確率, value: "約73%", hint: 0.5以上→合格と判定 }
  - { label: 判定, value: "合格", hint: しきい値0.5以上 }
sampleChart:
  type: logistic
  caption: 0/1の点をS字曲線で確率に。0.5を境に判定。
  x: { label: "勉強時間", unit: "時間" }
  y: { label: "合格確率" }
  threshold: 0.5
  points: [[1, 0], [2, 0], [3, 0], [5, 1], [6, 1], [8, 1]]
  curve: { b0: -4, b1: 1.0 }
results: 各要因の係数（YESになりやすさへの影響）と、1件ごとの「YESである確率」。確率にしきい値を当てて合格/不合格などのクラスに分類する。
howToRead: 確率0.7なら「YESの可能性が高い」。しきい値0.5なら0.5以上をYESと判定する。係数が正の要因はYESを起きやすく、負の要因は起きにくくする。
beforeAfter:
  before: 数値の組み合わせから「結局このケースはYESかNOか」を一貫した基準で言えない。
  after: 「勉強5時間なら合格確率80%、よって合格と予測」と確率つきで分類できる。
whenToUse:
  - 結果が2択で、その確率や分類を予測したいとき
  - どの要因が結果の起こりやすさに効くか知りたいとき
whenNotToUse:
  - 予測したいのが数値そのもの（金額など）のとき（回帰を使う）
  - クラスが3つ以上で関係が複雑なとき（決定木やランダムフォレストが有利なこともある）
cautions:
  - 確率を返すので、しきい値（0.5など）の置き方で判定が変わる点を意識する。
  - 説明変数が多すぎると過学習する。重要な変数に絞る。
  - クラスの数が極端に偏ると（例：99%がNO）精度が見かけ上高く出る。
related:
  - id: decision-tree
    type: 比較対象
    note: 同じ分類でも、決定木はYES/NOの枝分かれで判断ルールを示す。
  - id: multiple-regression
    type: 類似
    note: 仕組みは似るが、数値でなく確率（0〜1）を予測する点が違う。
  - id: random-forest
    type: 発展
    note: より複雑な分類には木を多数集めるランダムフォレストが強い。
aiPromptExample: このデータでロジスティック回帰を行い、各要因の影響と1件ごとのYES確率を出し、しきい値0.5での分類結果を説明してください。
codeExample:
  lang: python
  note: 標準ライブラリ math のシグモイドで確率を計算。
  code: |
    import math                          # シグモイド計算に math を使う
    b0, b1 = -4, 1.0                     # 学習済みの係数（切片b0・勉強時間の係数b1）
    x = 5                                # 勉強時間5時間のケース
    z = b0 + b1 * x                      # 回帰の直線値 z = -4 + 1.0×5 = 1
    p = 1 / (1 + math.exp(-z))           # シグモイドで0〜1の確率に変換
    print(round(p, 2))                   # 約0.73 → 合格確率73%（答えカードと一致）
    print("合格" if p >= 0.5 else "不合格")  # 0.5以上→合格（答えカードと一致）
derivation:
  intro: ロジスティック回帰は、まず回帰のように直線の値zを作り、それをS字の曲線で0〜1の「確率」に変換する。0.5を境にYES／NOを判定する。
  symbols:
    - { sym: "x", meaning: "説明変数（ここでは勉強時間）" }
    - { sym: "z", meaning: "直線で計算した中間の値（b_0 + b_1 x）" }
    - { sym: "p", meaning: "YESになる確率（0〜1のあいだ）" }
    - { sym: "e", meaning: "自然対数の底（約2.718の定数）" }
  steps:
    - formula: "z = b_0 + b_1 x"
      explain: まず回帰と同じように直線の値zを作る。係数b_1が正なら、xが増えるほどzが大きくなる。
      example: "z = -4 + 1.0 \\times 5 = 1"
      result: 勉強5時間ならz＝1
    - formula: "p = \\dfrac{1}{1 + e^{-z}}"
      explain: zをシグモイド関数に通すと、どんな値でも必ず0〜1のあいだに収まる。これがYESの確率になる。
      example: "p = \\dfrac{1}{1 + e^{-1}} \\approx \\dfrac{1}{1.37} \\approx 0.73"
      result: 勉強5時間の合格確率は約73%
    - formula: "p \\geq 0.5"
      explain: 確率がしきい値0.5以上ならYES（合格）、未満ならNO（不合格）と判定する。0.73は0.5以上なので「合格」と予測する。
      result: 確率0.73はしきい値0.5以上なので合格と判定
difficulty: 中級
tags: ["分類", "回帰分析", "確率"]
keywords: ["ロジスティック回帰", "logistic regression", "分類", "確率", "2値分類", "オッズ比"]
purposeCategories: ["分類したい"]
dataCategories: ["数値データ"]
mathCategories: ["回帰分析", "分類"]
formula: P(YES) = 1 / (1 + e^−(a₁X₁ + … + b))
