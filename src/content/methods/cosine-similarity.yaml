# src/content/methods/cosine-similarity.yaml
name: コサイン類似度
reading: こさいんるいじど
english: Cosine Similarity
summary: 2つのデータをベクトル（向きを持つ矢印）と見なし、その「向きの近さ」を測る指標。大きさより方向の似ている度合いを見る。
oneLiner: 2つのベクトルのなす角度で「向きの似ている度合い」を測る指標。テキストや嗜好の類似度に使う。
analogy: 2本の矢印が同じ方向を指していれば似ている、直角なら無関係、という見方。矢印の長さ（量の大小）は気にせず、向きだけを比べるイメージ。文章なら「使う言葉の傾向が似ているか」を矢印の向きで測る。
whatYouLearn: 2つのデータが「量の大小」ではなく「傾向・方向」としてどれだけ似ているかが分かる。文章同士や、ユーザーの好みの傾向が近いかどうかを数値で比べられる。
suitableData:
  - 数値データ（複数の数値で表されるベクトル）
  - テキストデータ（単語の出現回数などをベクトル化したもの）
  - 多次元データ（特徴量が多数あるデータ）
suitablePurposes:
  - 量の大小に左右されず、傾向が似ているものを探したい
inputData: 各データが同じ項目数の数値の並び（ベクトル）になっているもの。1行が1件（例：1つの文章、1人の好み）で、列がベクトルの各成分。
sampleTable:
  caption: 例：文章ごとの単語出現回数と、文章Aとの類似度
  columns: ["文章", "猫", "犬", "魚", "Aとの類似度"]
  rows:
    - ["A", "3", "1", "0", "1.00"]
    - ["B", "6", "2", "0", "1.00"]
    - ["C", "0", "1", "3", "0.10"]
    - ["D", "1", "0", "0", "0.95"]
keyResults:
  - { label: cosθ（文章A・B）, value: "1.00", hint: 向きが同じ＝似ている }
  - { label: cosθ（文章A・C）, value: "0.10", hint: 向きが違う＝似ていない }
sampleChart:
  type: vectors
  caption: 向きが近いほど似ている（cosθが1に近い）。
  x: { label: 猫 }
  y: { label: 犬 }
  vectors:
    - { label: 文章A, x: 3, y: 1, color: signal }
    - { label: 文章B, x: 6, y: 2, color: water }
    - { label: 文章C, x: 0, y: 3, color: good }
results: 2つのデータの類似度を表す数値。出現回数のような0以上の値では0〜1の範囲になり、1に近いほど向き（傾向）が似ている、0に近いほど無関係。
howToRead: 1に近いほど傾向が似ている、0付近なら共通点がほとんどない。文章AとBは単語数（量）は違うが向きが同じなので類似度1.00。量の大小ではなく「成分の比率・傾向」を見ている点がポイント。
beforeAfter:
  before: 文章量や購入数の多い少ないに引っ張られ、本当に傾向が似ているのか分からない。
  after: 量の差を無視して「向きの近さ」で測れ、傾向が似た文章やユーザーを客観的に探せる。
whenToUse:
  - 文章同士やユーザーの好みなど、量より「傾向の近さ」で似たものを探したいとき
  - 成分が多く、各データの大きさ（量）がまちまちなとき
whenNotToUse:
  - 量そのものの差（絶対的な大きさ）が重要なとき（向きしか見ないため見落とす）
  - マイナス値を含み「向き」の解釈が難しいとき
cautions:
  - 大きさ（量）の情報は無視される。量の違いが大事な場面では別の指標を使う。
  - 出現回数などでは0〜1だが、マイナスを含むベクトルでは-1〜1になり解釈が変わる。
  - データのベクトル化（単語の数え方・重み付け）の仕方で結果が変わる。
related:
  - id: knn
    type: 併用
    note: 「近さ」の物差しとしてコサイン類似度を使い、似たものをk個探す、という組み合わせができる。
  - id: correlation
    type: 類似
    note: どちらも「2つの並びがどれだけ同じように動くか」を測る。考え方が近い指標。
aiPromptExample: これらのデータをベクトルと見なしてコサイン類似度を計算し、対象に最も傾向が似ているものを挙げて理由を説明してください。
derivation:
  intro: コサイン類似度は「内積」を「それぞれの長さの積」で割るだけ。長さで割ることで量の大小が消え、向き（傾向）の近さだけが残る。
  symbols:
    - { sym: "A \\cdot B", meaning: "内積（同じ成分どうしを掛けて足す）" }
    - { sym: "|A|", meaning: "ベクトルAの長さ" }
    - { sym: "|B|", meaning: "ベクトルBの長さ" }
    - { sym: "\\cos\\theta", meaning: "コサイン類似度（向きの近さ）" }
  steps:
    - formula: "A \\cdot B = a_1 b_1 + a_2 b_2 + \\cdots"
      explain: 同じ項目どうしの回数を掛けて足す。文章Aを(3,1,0)、文章Bを(6,2,0)とする。
      example: "A \\cdot B = 3 \\times 6 + 1 \\times 2 + 0 \\times 0 = 20"
      result: 内積は20
    - formula: "|A| = \\sqrt{a_1^2 + a_2^2 + \\cdots}"
      explain: 各成分を2乗して足し、ルートを取ると、そのベクトルの長さになる。
      example: "|A| = \\sqrt{10},\\ |B| = \\sqrt{40}"
      result: それぞれの長さが出た
    - formula: "\\cos\\theta = \\dfrac{A \\cdot B}{|A| \\, |B|}"
      explain: 内積を2つの長さの積で割る。長さの影響が消えて、向きの近さだけが残る。
      example: "\\cos\\theta = \\dfrac{20}{\\sqrt{10} \\times \\sqrt{40}} = \\dfrac{20}{20} = 1.00"
      result: 類似度1.00で向きが完全に一致
difficulty: 初級
tags: ["類似度", "ベクトル", "テキスト"]
keywords: ["コサイン類似度", "cosine similarity", "類似度", "ベクトル", "角度", "テキスト類似", "レコメンド"]
purposeCategories: ["似ているものを探したい"]
dataCategories: ["数値データ", "テキストデータ", "多次元データ"]
mathCategories: ["ベクトル・距離・類似度"]
formula: コサイン類似度 = (ベクトルAとBの内積) ÷ (Aの長さ × Bの長さ)
