# src/content/methods/zscore.yaml
name: z-score
reading: ぜっとすこあ
english: Z-score (Standard Score)
summary: ある値が、平均から標準偏差いくつ分だけ離れているかを表す数値。データの「珍しさ」をそろった物差しで測れる。
oneLiner: 「平均から標準偏差何個分ずれているか」を表す値。外れ値（異常）の検知に使える。
analogy: テストで70点でも、平均が高くてばらつきの小さいクラスでの70点と、平均が低くばらつきの大きいクラスでの70点では意味が違う。z-score は「そのクラスの中でどれくらい珍しい点か」を共通のものさしに直すイメージ。
whatYouLearn: 単位や平均・ばらつきの違うデータでも、「平均からどれだけ離れているか」を同じ尺度で比べられる。値が大きく離れているものを異常（外れ値）として見つけられる。
suitableData:
  - 数値データ（平均と標準偏差が意味を持つ、おおむね左右対称なデータ）
suitablePurposes:
  - 平均から大きく外れた値（異常・外れ値）を見つけたい
inputData: 1列の数値データ。全体の平均と標準偏差を求め、各値がそこから何個分離れているかに変換する。
sampleTable:
  caption: 例：点数とz-score（平均70・標準偏差10のとき）
  columns: ["値", "z-score", "解釈"]
  rows:
    - ["50", "-2.0", "かなり低い"]
    - ["60", "-1.0", "やや低い"]
    - ["70", "0.0", "平均ちょうど"]
    - ["80", "+1.0", "やや高い"]
    - ["100", "+3.0", "極端に高い（異常の疑い）"]
keyResults:
  - { label: 100のz, value: "+3", hint: 平均から3SD離れている（異常の疑い） }
sampleChart:
  type: histogram
  caption: 平均から何SD離れているか＝z。±2SDを超えると珍しい。
  x:
    label: 値
  y:
    label: 頻度
  referenceLines:
    - axis: x
      value: 70
      label: 平均
      color: gold
    - axis: x
      value: 80
      label: +1SD
    - axis: x
      value: 60
      label: -1SD
    - axis: x
      value: 90
      label: +2SD
      color: signal
    - axis: x
      value: 50
      label: -2SD
      color: water
  annotations:
    - x: 100
      y: 1
      label: z=+3 異常の疑い
      color: signal-deep
  series:
    - label: 頻度
      points: [[40, 1], [50, 3], [60, 8], [70, 12], [80, 8], [90, 3], [100, 1]]
results: 各値が平均から標準偏差いくつ分離れているかを表す数値（0が平均、±1が標準偏差1個分）。プラスは平均より大きい、マイナスは小さいことを表す。
howToRead: 0に近いほど平均的、絶対値が大きいほど珍しい。目安として絶対値2を超えると「やや外れ値」、3を超えると「強い外れ値（異常の疑い）」とされることが多い。符号は平均より上か下かを示す。
beforeAfter:
  before: 「100点」が珍しいのか普通なのか、そのデータの中での位置づけが分からない。
  after: 「z=+3で極端に高い」と分かり、注目すべき値や異常を客観的に絞り込める。
whenToUse:
  - 平均から大きく外れた値（異常・外れ値）を見つけたいとき
  - 単位や尺度の違う複数のデータを同じものさしで比べたいとき
whenNotToUse:
  - 分布が大きく偏っている、または外れ値が多すぎるとき（平均と標準偏差自体がゆがむ）
  - 件数が極端に少ないとき（平均・標準偏差が安定しない）
cautions:
  - 平均と標準偏差を使うため、それらが外れ値に引きずられると基準もゆがむ。
  - おおむね左右対称な分布を前提とする。偏った分布では「珍しさ」の解釈に注意。
  - 「z-scoreが大きい＝必ず異常」ではない。業務的に妥当かは別途判断する。
related:
  - id: std-dev
    type: 前提
    note: z-score は「平均からの差を標準偏差で割った」もの。標準偏差を理解していると意味が腹落ちする。
  - id: deviation-value
    type: 類似
    note: 偏差値は z-score を10倍して50を足したもの。中身は同じ考え方。
aiPromptExample: このデータの各値の z-score を計算し、絶対値が2や3を超える外れ値（異常の疑い）があれば挙げて説明してください。
codeExample:
  lang: python
  note: 標準ライブラリ statistics で平均・母標準偏差を求めて z に変換。
  code: |
    import statistics

    data = [50, 60, 70, 80, 100]        # 点数（平均70・標準偏差10／このページの例データ）
    mean = statistics.mean(data)        # 平均
    sd = statistics.pstdev(data)        # 母標準偏差
    x = 100                            # z-scoreを知りたい値
    z = (x - mean) / sd                # z = (値−平均)/標準偏差
    print(z)                           # 3.0 → 答えカードの「100のz=+3（異常の疑い）」と一致
derivation:
  intro: z-scoreは「平均から標準偏差いくつ分ずれているか」を表す値。平均を引いて標準偏差で割るだけ。ここでは平均70・標準偏差10のデータで、100という値を計算する。
  symbols:
    - { sym: "x", meaning: "変換したい値（ここでは100）" }
    - { sym: "\\bar{x}", meaning: "平均（ここでは70）" }
    - { sym: "\\sigma", meaning: "標準偏差（ここでは10）" }
    - { sym: "z", meaning: "z-score（標準得点）" }
  steps:
    - formula: "x - \\bar{x}"
      explain: まず値から平均を引く。平均よりどれだけ離れているか（差）を出す。プラスなら上、マイナスなら下。
      example: "100 - 70 = 30"
      result: 平均より30だけ大きい
    - formula: "z = \\dfrac{x - \\bar{x}}{\\sigma}"
      explain: その差を標準偏差で割る。「ばらつき何個分ずれているか」に直すので、単位の違うデータでも同じものさしで比べられる。
      example: "z = \\dfrac{30}{10} = 3"
      result: 標準偏差3個分上＝強い外れ値の疑い
difficulty: 初級
tags: ["異常検知", "標準化", "外れ値"]
keywords: ["z-score", "zスコア", "標準得点", "標準化", "外れ値", "異常検知", "標準偏差"]
purposeCategories: ["異常を見つけたい"]
dataCategories: ["数値データ"]
mathCategories: ["異常検知", "基礎統計"]
formula: z = (値 − 平均) ÷ 標準偏差
