# src/content/methods/chi-squared.yaml
name: カイ二乗検定
reading: かいにじょうけんてい
english: Chi-squared Test
summary: 2つのカテゴリ（分類）の間に関連があるかを、件数のクロス集計から統計的に判定する手法。
oneLiner: カテゴリ同士（例：性別と好み）に関連があるかを件数から確かめる検定。
analogy: 「男女で好きなジャンルが違うか」を調べるイメージ。男女どちらも同じ割合で選んでいれば関連なし、男女で偏りが大きければ「性別と好みに関連あり」と判断する。
whatYouLearn: 2つのカテゴリ変数の間に関連（偏り）があるか、それとも独立（無関係）かが分かる。割合の差が偶然の範囲かどうかを判定できる。
suitableData:
  - カテゴリデータ。2つの分類でクロス集計できるもの（例：性別×購入有無）
suitablePurposes:
  - 2つのカテゴリ項目の間に関連があるかを知りたい
inputData: 2つのカテゴリ列を持つデータ。これをクロス集計表（件数の表）にして使う。各マスにある程度の件数が必要。
sampleTable:
  caption: 例：性別×購入有無のクロス集計（人数）
  columns: ["", "購入した", "購入しなかった"]
  rows:
    - ["男性", "30", "70"]
    - ["女性", "55", "45"]
keyResults:
  - { label: 判定, value: "関連あり", hint: p<0.05 }
  - { label: 男性×購入の期待度数, value: "42.5", unit: 人, hint: 100×85÷200 }
sampleChart:
  type: bar
  caption: クロス集計の偏り（観測のズレ）を見る。
  grouped: true
  categories: ["男性", "女性"]
  x: { label: "性別" }
  y: { label: "人数", unit: "人" }
  series:
    - label: 購入
      color: signal
      points: [[1, 30], [2, 55]]
    - label: 非購入
      color: water
      points: [[1, 70], [2, 45]]
results: カイ二乗値とp値。p値が小さい（一般に0.05未満）ほど「2つのカテゴリは無関係とは言いにくい＝関連がある」と判断する。
howToRead: p値が0.05未満なら「2つの分類に統計的な関連がある（割合の偏りは偶然では説明しにくい）」。0.05以上なら「関連があるとは言い切れない」。どの組み合わせで偏りが大きいかはクロス集計表の割合を見て解釈する。
beforeAfter:
  before: クロス集計表を見て「男女で購入率が違う気がする」と思うが、偶然か判断できない。
  after: 「p<0.05で性別と購入有無には関連がある」と根拠を持って言える。
whenToUse:
  - 性別×購入、地域×満足度などカテゴリ同士の関連を調べたいとき
  - アンケートの選択肢同士の偏りを検証したいとき
whenNotToUse:
  - 比べたいのが数値の平均のとき（t検定が適切）
  - 各マスの件数が極端に少ないとき（判定の前提が崩れる）
cautions:
  - 関連があると分かっても、どちらが原因かやどれくらい強い関連かは別途確認する。
  - 各セルの期待件数が小さすぎると結果が不正確になる（目安5未満が多いと注意）。
  - 件数が非常に多いと、わずかな偏りでも有意になりやすい。
related:
  - id: t-test
    type: 比較対象
    note: カイ二乗はカテゴリの割合を、t検定は数値の平均を比べる。対象が異なる。
  - id: mode
    type: 補完
    note: カテゴリの最頻値（最多カテゴリ）を見ると、偏りの中身を直感的に把握できる。
aiPromptExample: このクロス集計にカイ二乗検定を行い、2つのカテゴリに関連があるか（p値）と、どの組み合わせで偏りが大きいかを説明してください。
derivation:
  intro: カイ二乗検定は「実際の件数（観測度数O）」と「関連がなければこうなるはずの件数（期待度数E）」のズレを合計するだけ。ズレが大きいほど「関連あり」に近づく。
  symbols:
    - { sym: "O", meaning: "観測度数（実際に数えた件数）" }
    - { sym: "E", meaning: "期待度数（関連がないと仮定したときの件数）" }
    - { sym: "R", meaning: "そのマスがある行の合計" }
    - { sym: "C", meaning: "そのマスがある列の合計" }
    - { sym: "N", meaning: "全体の合計（総数）" }
    - { sym: "\\chi^2", meaning: "ズレの合計（カイ二乗値。大きいほど偏りが大きい）" }
  steps:
    - formula: "E = \\dfrac{R \\times C}{N}"
      explain: 各マスの期待度数Eを「その行の合計×その列の合計÷全体の合計」で求める。男女・購入の割合が無関係ならこうなるはず、という件数。
      example: "E = \\dfrac{100 \\times 85}{200} = 42.5"
      result: 男性×購入の期待度数は42.5人（全体200人、購入計85人、男性計100人）
    - formula: "\\dfrac{(O - E)^2}{E}"
      explain: 各マスで「実際の件数Oと期待値Eの差」を2乗してEで割る。2乗するのでズレの向き（多い・少ない）に関係なく、大きさだけを見られる。
      example: "\\dfrac{(30 - 42.5)^2}{42.5} = \\dfrac{156.25}{42.5} \\approx 3.68"
      result: 男性×購入のマスのズレは約3.68
    - formula: "\\chi^2 = \\sum \\dfrac{(O - E)^2}{E}"
      explain: すべてのマスのズレを足し合わせたものがカイ二乗値。これが大きいほど偏りが強く、p値が0.05未満なら「2つのカテゴリに関連あり」と判断する。
      result: 全マスのズレを合計し、p<0.05なら関連あり
difficulty: 中級
tags: ["統計的検定", "仮説検定", "カテゴリ分析"]
keywords: ["カイ二乗検定", "chi-squared", "クロス集計", "独立性の検定", "p値", "カテゴリ"]
purposeCategories: ["関係性を知りたい"]
dataCategories: ["カテゴリデータ"]
mathCategories: ["統計的検定"]
