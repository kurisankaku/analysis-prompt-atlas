# src/content/methods/scatter-plot.yaml
name: 散布図
reading: さんぷず
english: Scatter Plot
summary: 2つの数値を縦軸・横軸にとり、1件ごとに点を打って2変数の関係を見る図。
oneLiner: 2つの数値の「関係（右肩上がりか、ばらけているか）」を点の散らばりで見る図。
analogy: 横軸に「勉強時間」、縦軸に「テスト点」をとり、生徒1人を1つの点として打つイメージ。点が右肩上がりに並べば「勉強するほど点が高い」傾向が見える。
whatYouLearn: 2つの数値の間に関係があるか、あるとすればどんな向き（正・負）か、直線的か曲線的か、外れ値はあるかが視覚的に分かる。
suitableData:
  - 数値データを2列（例：時間と点数、広告費と売上）持つデータ
suitablePurposes:
  - 2つの数値の関係性を視覚的に知りたい
inputData: 1行が1件で、2列の数値（x と y）を持つデータ。例：1人ごとの勉強時間と点数。
sampleTable:
  caption: 例：勉強時間と点数（6人）
  columns: ["生徒", "勉強時間(h)", "点数"]
  rows:
    - ["A", "1", "55"]
    - ["B", "2", "60"]
    - ["C", "3", "70"]
    - ["D", "4", "75"]
    - ["E", "5", "85"]
    - ["F", "6", "90"]
sampleChart:
  type: scatter
  fit: true
  caption: 右肩上がり＝正の関係。
  x:
    label: 勉強時間
    unit: 時間
  y:
    label: 点数
    unit: 点
  series:
    - label: 勉強時間と点数
      points: [[1, 55], [2, 60], [3, 70], [4, 75], [5, 85], [6, 90]]
results: 点の散らばり方。右肩上がりなら正の関係、右肩下がりなら負の関係、バラバラなら関係が弱い。
howToRead: 点が右肩上がりに並べば「一方が増えると他方も増える」。右肩下がりなら「一方が増えると他方は減る」。雲のように広がっていれば関係は弱い。直線から大きく離れた点は外れ値。
beforeAfter:
  before: 2列の数値表を見ても、互いに関係があるのか判断できない。
  after: 点の並びから「勉強時間が長いほど点数も高い」と関係の向きと強さがつかめる。
whenToUse:
  - 2つの数値の関係の有無や向きを最初に確認したいとき
  - 相関や回帰を計算する前の「目で見る」確認をしたいとき
whenNotToUse:
  - 片方がカテゴリデータのとき（散布図は数値2つが前提）
  - 3つ以上の変数の関係を同時に見たいとき
cautions:
  - 関係が見えても因果関係（原因と結果）とは限らない。
  - 点が重なって見えにくいときは、件数が多い領域を見落としやすい。
related:
  - id: correlation
    type: 併用
    note: 散布図で見た関係の強さを、相関係数で数値化すると客観的になる。
  - id: simple-regression
    type: 発展
    note: 関係を直線の式で表し予測に使うのが単回帰。散布図がその出発点。
  - id: covariance
    type: 補完
    note: 2変数が一緒に動く度合いを数値で表す。散布図の向きと対応する。
aiPromptExample: この2列の数値を散布図にして、関係の向き（正・負）と強さ、外れ値の有無を一言で説明してください。
difficulty: 基礎
tags: ["基礎統計", "可視化", "関係性", "解釈しやすい"]
keywords: ["散布図", "scatter plot", "相関", "2変数", "関係性", "プロット"]
purposeCategories: ["関係性を知りたい"]
dataCategories: ["数値データ"]
mathCategories: ["基礎統計"]
