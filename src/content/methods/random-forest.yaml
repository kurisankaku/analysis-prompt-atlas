# src/content/methods/random-forest.yaml
name: ランダムフォレスト
reading: らんだむふぉれすと
english: Random Forest
summary: たくさんの決定木を作り、その多数決で分類・予測する精度の高い手法。
oneLiner: 少しずつ違う決定木を大量に育て、みんなの投票（多数決）で結論を出す手法。
analogy: 1人の専門家の意見より、たくさんの専門家にそれぞれ判断させて多数決を取る方が安定する、というイメージ。木が集まって森（フォレスト）になる。
whatYouLearn: 多数の決定木の投票で、1本の木より安定して精度の高い分類・予測ができる。あわせて「どの要因が予測に効いているか（重要度）」も分かる。
suitableData:
  - 数値データ・多次元データ。説明変数が多く、関係が複雑でもよい
suitablePurposes:
  - 高い精度で分類・予測し、効く要因も知りたい
inputData: 説明変数（数値・カテゴリの列が複数）と、分類・予測したい目的変数を持つデータ。1行が1件に対応する。
sampleTable:
  caption: 例：顧客が解約するかの予測
  columns: ["利用月数", "問合せ回数", "月額(円)", "解約"]
  rows:
    - ["24", "0", "3000", "継続"]
    - ["2", "5", "5000", "解約"]
    - ["18", "1", "4000", "継続"]
    - ["1", "8", "6000", "解約"]
results: 多数の木の多数決による分類・予測結果と、各要因の「重要度（予測への効き具合）」。1本の木より安定した結果が得られる。
howToRead: 出力は「木たちの投票結果」。重要度の高い変数ほど予測を左右する。1本の木のような明快なルール図は得にくいが、精度と安定性が高い。
beforeAfter:
  before: 1本の決定木では結果がぶれて、予測精度が頭打ちになる。
  after: 多数の木の多数決で精度と安定性が上がり、効く要因も重要度で把握できる。
whenToUse:
  - とにかく分類・予測の精度を上げたいとき
  - 変数が多く関係が複雑なデータを扱うとき
whenNotToUse:
  - 判断理由を1枚の図でシンプルに説明したいとき（1本の決定木が向く）
  - データや計算資源が乏しく、軽い手法で十分なとき
cautions:
  - 木を増やせば過学習しにくくなるが、ゼロではない。検証データで確認する。
  - 「なぜその予測か」をルールで説明しにくい（ブラックボックス寄り）。
  - 木が多いと計算量・メモリが増え、結果が出るまで重くなることがある。
related:
  - id: decision-tree
    type: 前提
    note: 基本部品が決定木。その弱点を多数決で補ったのがランダムフォレスト。
  - id: multiple-regression
    type: 比較対象
    note: 直線で表す回帰に対し、複雑・非線形な関係を木で捉える。
  - id: knn
    type: 比較対象
    note: どちらも分類に使えるが、考え方（木の多数決 vs 近い仲間）が異なる。
aiPromptExample: このデータでランダムフォレストによる分類を行い、精度と各変数の重要度を出し、過学習の有無を検証データで確認してください。
difficulty: 上級
tags: ["分類", "予測", "アンサンブル"]
keywords: ["ランダムフォレスト", "random forest", "分類", "予測", "決定木", "アンサンブル学習", "変数重要度"]
purposeCategories: ["分類したい", "予測したい", "影響要因を知りたい"]
dataCategories: ["数値データ", "多次元データ"]
mathCategories: ["分類"]
