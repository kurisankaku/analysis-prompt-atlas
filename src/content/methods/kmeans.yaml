# src/content/methods/kmeans.yaml
name: k-means
reading: けーみーんず
english: k-means Clustering
summary: データを、あらかじめ決めた個数（k個）のグループに、近いもの同士でまとめて自動的に分ける手法。
oneLiner: 似たデータ同士を、指定した数のグループに自動でまとめる代表的なクラスタリング手法。
analogy: 教室の生徒を「身長と体重が近い人同士」で3班に分ける作業を、コンピュータが自動でやるイメージ。各班の真ん中（重心）に近い人をその班に入れ、班分けと重心を何度も微調整してしっくりくる形に落ち着かせる。
whatYouLearn: 正解ラベルがないデータでも、隠れた「似たもの集団」が見えてくる。顧客や商品を性質ごとに自動でグループ分けでき、それぞれの特徴を整理できる。
suitableData:
  - 数値データ（各件が複数の数値で表せるもの。例：購入金額と来店回数）
  - 多次元データ（特徴量が多数あるデータ）
suitablePurposes:
  - 似たもの同士をいくつかのグループに自動で分けたい
inputData: 1行が1件（例：1人の顧客）で、複数の数値列（特徴量）を持つデータ。事前にグループ数 k を自分で決める必要がある。
sampleTable:
  caption: 例：顧客の来店回数と購入金額
  columns: ["顧客", "来店回数", "購入金額(千円)"]
  rows:
    - ["A", "2", "5"]
    - ["B", "3", "6"]
    - ["C", "9", "40"]
    - ["D", "10", "42"]
    - ["E", "20", "12"]
    - ["F", "22", "15"]
sampleChart:
  type: clusters
  caption: データを3つのかたまりに分け、各重心(✕)を中心に置く。
  x: { label: 来店回数, unit: 回 }
  y: { label: 購入金額, unit: 千円 }
  clusters:
    - label: グループ1（少回数・少額）
      color: signal
      points: [[2, 5], [3, 6], [4, 7]]
      centroid: [3, 6]
    - label: グループ2（中回数・高額）
      color: water
      points: [[9, 40], [10, 42], [11, 38]]
      centroid: [10, 40]
    - label: グループ3（多回数・少額）
      color: good
      points: [[20, 12], [22, 15], [24, 13]]
      centroid: [22, 13.3]
results: 各データがどのグループ（クラスタ）に属するかの割り当てと、各グループの中心（重心）。例では「少額・少回数」「高額・中回数」「少額・多回数」の3タイプに分かれる。
howToRead: 同じグループのデータは性質が似ている。各グループの重心の値を見ると、そのグループがどんな特徴の集団か（例：来店は多いが少額）が分かる。グループ数 k は自分で決めた値なので、k を変えると結果も変わる。
beforeAfter:
  before: 顧客が大勢いるが、どんなタイプに分かれるのか分からず一括りに扱っている。
  after: 「優良層」「ライト層」など数グループに自動で分かれ、グループごとの施策を考えられる。
whenToUse:
  - 正解ラベルがないデータを、性質の近いいくつかのグループに分けたいとき
  - 顧客・商品などをセグメントに分けて特徴を整理したいとき
whenNotToUse:
  - グループ数の見当が全くつかず、階層構造で確かめたいとき（階層クラスタリングが向く）
  - グループが細長い形や入り組んだ形をしているとき（丸い塊を前提にするため苦手）
cautions:
  - グループ数 k を事前に自分で決める必要がある。k次第で結果が変わるため、複数の k を試して比べる。
  - 初期値（最初の重心位置）によって結果が変わることがある。何度か実行して安定するか確認する。
  - 各特徴量のスケール（単位）がそろっていないと、値の大きい列に引っ張られる。標準化してから使う。
related:
  - id: hierarchical-clustering
    type: 比較対象
    note: グループ数を後から決められる別のクラスタリング。k-means と結果を見比べると納得感が増す。
  - id: knn
    type: 比較対象
    note: どちらも「近さ」を使うが、knn は正解ラベルありの分類、k-means はラベルなしのグループ分け。
  - id: pca
    type: 前処理
    note: 特徴量が多いとき PCA で次元を減らしてから k-means にかけると、計算も安定し可視化もしやすい。
aiPromptExample: このデータを k-means でグループ分けし、適切なグループ数の目安と各グループの特徴を説明してください。事前に標準化が必要かも教えてください。
derivation:
  intro: k-meansは「各点を一番近い中心(重心)のグループに入れる→グループの真ん中を計算し直す」をくり返すだけ。動きが止まったら完成。
  symbols:
    - { sym: "\\mu_c", meaning: "グループcの重心（中心の座標。「ミューシー」と読む）" }
    - { sym: "n_c", meaning: "グループcに入っている点の数" }
    - { sym: "d", meaning: "点と重心の距離（小さいほど近い）" }
  steps:
    - formula: "d = \\sqrt{(x_1-x_2)^2 + (y_1-y_2)^2}"
      explain: 各点について、それぞれの重心までの距離を計算し、一番近い重心のグループに入れる。
      example: "d = \\sqrt{(4-3)^2 + (7-6)^2} = \\sqrt{2} \\approx 1.4"
      result: 点(4,7)は重心(3,6)に近いのでグループ1へ
    - formula: "\\mu_c = \\dfrac{1}{n_c}\\sum x"
      explain: グループに入った点の座標を平均すると、新しい重心になる。各軸（x座標・y座標）ごとに平均をとるだけ。
      example: "\\mu_c = \\left(\\dfrac{2+3+4}{3}, \\dfrac{5+6+7}{3}\\right) = (3, 6)"
      result: グループ1の新しい重心は(3,6)
    - formula: "d \\to min"
      explain: 「割り当て→重心の更新」をくり返すと、各点と重心の距離の合計がだんだん縮む。もう動かなくなったら終了。
      result: 重心が動かなくなれば完成
difficulty: 中級
tags: ["クラスタリング", "教師なし", "セグメンテーション"]
keywords: ["k-means", "kmeans", "クラスタリング", "グループ分け", "重心", "セグメント", "教師なし学習"]
purposeCategories: ["グループ分けしたい"]
dataCategories: ["数値データ", "多次元データ"]
mathCategories: ["クラスタリング"]
formula: 各点を最も近い重心のグループに割り当て、重心を更新する操作を繰り返す（グループ内のばらつきの合計を最小化）
