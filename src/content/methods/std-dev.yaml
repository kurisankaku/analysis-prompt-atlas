# src/content/methods/std-dev.yaml
name: 標準偏差
reading: ひょうじゅんへんさ
english: Standard Deviation
summary: データのばらつきの大きさを、元データと同じ単位で表した指標。分散の平方根。
oneLiner: 「平均からだいたいどれくらいズレているか」を元の単位で表すばらつきの指標。
analogy: 平均点が60点で標準偏差が10点なら「だいたい50〜70点の範囲に多くの人がいる」というイメージ。平均の周りの“散らばり幅”を実感できる数値にしたもの。
whatYouLearn: 多くのデータが平均からおおよそどれくらいの幅に収まっているかが、元データと同じ単位で分かる。値が小さいほど揃っており、大きいほど散らばっている。
suitableData:
  - 数値データ（点数、金額、測定値、所要時間など）
suitablePurposes:
  - データのばらつきを元の単位で分かりやすく知りたい
inputData: 1列の数値が並んだデータ。1行が1件に対応する。ある程度件数があると安定する。
sampleTable:
  caption: 例：10人のテスト点数（平均約76点）
  columns: ["点数の階級", "人数"]
  rows:
    - ["55〜65点", "1"]
    - ["65〜75点", "4"]
    - ["75〜85点", "3"]
    - ["85〜95点", "2"]
keyResults:
  - { label: 平均, value: "76", unit: 点 }
  - { label: 標準偏差, value: "10", unit: 点, hint: "√分散（分散100）" }
sampleChart:
  type: histogram
  caption: 平均±1SDの範囲に大半が収まる。
  x: { label: "点数", unit: "点" }
  y: { label: "人数", unit: "人" }
  series:
    - label: 人数
      color: water
      points: [[60, 1], [70, 4], [80, 3], [90, 2]]
  referenceLines:
    - { axis: 'x', value: 76, label: "平均", color: gold }
  referenceAreas:
    - { axis: 'x', from: 67, to: 85, label: "±1SD", color: water }
results: ばらつきを表す1つの数値（この例では約10点）。平均±標準偏差（66〜86点）あたりに多くのデータが入る目安になる。
howToRead: 標準偏差が小さいほどデータが平均の近くに揃い、大きいほど散らばっている。釣鐘型の分布なら、おおよそ平均±1標準偏差に約7割、±2標準偏差に約95％が収まる。平均が同じでも標準偏差が違えば安定度が違う。
beforeAfter:
  before: 平均約76点とだけ分かっても、点が揃っているのか散らばっているのか判断できない。
  after: 「平均約76点・標準偏差10点」で、多くが66〜86点に収まる散らばり具合まで示せる。
whenToUse:
  - ばらつきを元データと同じ単位で直感的に示したいとき
  - 平均と一緒に「中心＋散らばり」をセットで報告したいとき
whenNotToUse:
  - 外れ値が多く分布が大きく歪むとき（四分位範囲の方が頑健）
  - データが釣鐘型から大きく外れるとき（±1標準偏差の目安が当てにならない）
cautions:
  - 外れ値の影響を受けやすい。極端な値があると実態より大きく出る。
  - 「平均±標準偏差に約7割」の目安は、左右対称の釣鐘型に近い分布での話。
related:
  - id: variance
    type: 前提
    note: 分散の平方根が標準偏差。分散を元の単位に戻して読みやすくしたもの。
  - id: histogram
    type: 併用
    note: ヒストグラムで分布の形を見て、標準偏差で散らばりを数値化すると裏づけになる。
  - id: deviation-value
    type: 発展
    note: 平均と標準偏差を使って各データの相対位置を点数化したのが偏差値。
aiPromptExample: このデータの平均と標準偏差を計算し、多くのデータがどの範囲に収まるかを元の単位で説明してください。
codeExample:
  lang: python
  note: 標準ライブラリ statistics の pstdev（母標準偏差・√分散）を使用。
  code: |
    import statistics

    # 階級の代表値を人数分だけ並べた10人の点数（このページの例データ）
    scores = [60] * 1 + [70] * 4 + [80] * 3 + [90] * 2
    mean = statistics.mean(scores)      # 平均 = 合計 ÷ 人数
    sd = statistics.pstdev(scores)      # 母標準偏差 = √分散（分散100 → 10）
    print(mean, sd)                     # 76 10.0 → 答えカードの平均76点・標準偏差10点と一致
derivation:
  intro: 標準偏差は「分散の平方根」。分散は単位が2乗（点²）で読みにくいので、平方根をとって元の単位（点）に戻したのが標準偏差。ここでは平均76点・分散100のテストで考える。
  symbols:
    - { sym: "\\sigma^2", meaning: "分散（ばらつきを2乗した単位で表した値）" }
    - { sym: "\\sigma", meaning: "標準偏差（「シグマ」と読む）" }
    - { sym: "\\sqrt{\\;}", meaning: "平方根（2乗すると中身になる数）" }
  steps:
    - formula: "\\sigma^2 = \\dfrac{1}{n}\\sum_{i=1}^{n}(x_i - \\bar{x})^2"
      explain: まず分散を求める。各データの平均からのズレを2乗して平均した値で、ばらつきの大きさを表す。
      example: "\\sigma^2 = 100"
      result: 分散は100（単位は点²）
    - formula: "\\sigma = \\sqrt{\\sigma^2}"
      explain: 分散の平方根をとる。2乗で大きくなり単位もズレた値を、平方根で元の単位（点）に戻すと直感的に読める。
      example: "\\sigma = \\sqrt{100} = 10"
      result: 標準偏差は約10点
difficulty: 初級
tags: ["基礎統計", "ばらつき", "解釈しやすい"]
keywords: ["標準偏差", "standard deviation", "SD", "ばらつき", "散らばり", "シグマ"]
purposeCategories: ["ばらつきを知りたい"]
dataCategories: ["数値データ"]
mathCategories: ["基礎統計"]
formula: 標準偏差 = √分散 = √[{(x₁−平均)² + … + (xₙ−平均)²} / n]
