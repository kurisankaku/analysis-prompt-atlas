# src/content/methods/pca.yaml
name: 主成分分析（PCA）
reading: しゅせいぶんぶんせき
english: Principal Component Analysis (PCA)
summary: たくさんの変数（列）を、情報をなるべく保ったまま少数の新しい軸にまとめ直し、データを圧縮・可視化する手法。
oneLiner: 多数の変数を、情報を保ちつつ少数の軸に圧縮し、全体像を見やすくする次元削減の代表手法。
analogy: 立体的な物体を、いちばん形がよく分かる角度から写真に撮るイメージ。3Dを2Dの紙に写すと情報は少し減るが、特徴がいちばん残る向きを選べば全体像はつかめる。PCAは「データのばらつきが最も大きい向き」を新しい軸に選ぶ。
whatYouLearn: 列が多すぎて見通せないデータを、2〜3個の軸にまとめて散布図で眺められる。どの変数がまとまって動いているか、データ全体の主要な違いの軸が見えてくる。
suitableData:
  - 多次元データ（変数・列が多い数値データ。例：アンケートの多数項目、センサーの多数指標）
suitablePurposes:
  - 多数の変数を少数の軸に減らして、全体像を見たい・整理したい
inputData: 1行が1件で、数値列が多数あるデータ。各列のスケールがそろっていないと結果が偏るため、通常は標準化してから使う。
sampleTable:
  caption: 例：5教科の点数を2軸に圧縮（イメージ）
  columns: ["生徒", "第1主成分", "第2主成分"]
  rows:
    - ["A", "2.1", "-0.3"]
    - ["B", "1.8", "0.5"]
    - ["C", "-0.2", "1.9"]
    - ["D", "-2.0", "-0.4"]
    - ["E", "-1.7", "-1.7"]
keyResults:
  - { label: 第1主成分の寄与率, value: "約70%", hint: 2軸で大半のばらつきを説明 }
sampleChart:
  type: scatter
  caption: 多数の変数をPC1/PC2の2軸に圧縮して広がりを見る。
  x: { label: "第1主成分(PC1)" }
  y: { label: "第2主成分(PC2)" }
  annotations:
    - { x: 2.1, y: -0.3, label: "PC1=最大ばらつき方向", place: "top" }
  series:
    - label: 主成分で見たデータ
      points: [[2.1, -0.3], [1.8, 0.5], [-0.2, 1.9], [-2.0, -0.4], [-1.7, -1.7], [0.3, 0.8]]
results: 元の多数の変数をまとめた新しい少数の軸（主成分）の値と、各軸が全体のばらつきをどれだけ説明するか（寄与率）。第1主成分がデータの最も大きな違いの方向を表す。
howToRead: 寄与率を見て「第1・第2主成分で全体の何割を説明できるか」を確認する。散布図で近い点同士は性質が似ている。ただし新しい軸は元の変数の混合なので、「この軸が何を意味するか」の解釈は慎重に行う。
beforeAfter:
  before: 列が何十個もあり、どこを見れば全体の違いが分かるのか手がつけられない。
  after: 2軸の散布図にまとまり、データの広がりや似たもの集団がひと目で見える。
whenToUse:
  - 変数（列）が多すぎて全体像が見えないデータを圧縮・可視化したいとき
  - クラスタリングなどの前に変数を減らして計算を安定させたいとき
whenNotToUse:
  - 各変数の意味をそのまま保ったまま解釈したいとき（軸が混ざって分かりにくくなる）
  - 変数間の関係が直線的でないとき（直線的な関係を前提にするため苦手）
cautions:
  - 新しい軸（主成分）は元の変数の混ぜ合わせなので、軸の意味の解釈が難しいことがある。
  - スケールの大きい変数に引っ張られる。通常は標準化してから使う。
  - 圧縮で情報は必ず一部失われる。寄与率を見て「どれだけ残ったか」を確認する。
related:
  - id: scatter-plot
    type: 併用
    note: PCAで2軸にまとめた結果は散布図で眺めると理解しやすい。
  - id: kmeans
    type: 前処理
    note: 変数が多いとき PCA で次元を減らしてから k-means にかけると、計算が安定し可視化もしやすい。
  - id: hierarchical-clustering
    type: 前処理
    note: 次元を減らしてから階層クラスタリングにかけると距離計算が安定する。
aiPromptExample: このデータに主成分分析を行い、第1・第2主成分の寄与率と、各主成分がどんな変数の組み合わせを表しているかを分かりやすく説明してください。
codeExample:
  lang: python
  note: scikit-learn を使用。
  code: |
    from sklearn.decomposition import PCA     # 次元削減の PCA を読み込む
    X = [[90, 85, 30, 40, 95], [80, 88, 35, 30, 90],  # 5教科の点数（生徒ごと）
         [40, 45, 88, 92, 50], [30, 35, 20, 25, 30],
         [25, 20, 40, 35, 28]]
    pca = PCA(n_components=2).fit(X)          # ばらつき最大の2軸に圧縮
    ratio = pca.explained_variance_ratio_     # 各主成分の寄与率
    print(round(ratio[0], 2))                 # 第1主成分の寄与率 → 約0.7（答えカードと一致）
derivation:
  intro: PCAは「データがいちばん大きく散らばっている向き」を新しい軸（第1主成分）に選び、その軸上にデータを写し取るだけ。少ない軸でデータの違いをなるべく多く残すのが狙い。
  symbols:
    - { sym: "z", meaning: "新しい軸（主成分）に写したあとの値" }
    - { sym: "w", meaning: "主成分の方向（散らばりが最大になる向き）" }
    - { sym: "x", meaning: "元のデータ（多数の変数を並べたもの）" }
    - { sym: "\\lambda", meaning: "各主成分が説明する散らばり（分散）の大きさ" }
  steps:
    - formula: "z = w^T x"
      explain: "元データxを、選んだ向きwに写し取る（射影する）と、新しい軸の値zが1つの数で得られる。多数の変数が1本の軸にまとまる。"
      result: 多数の変数が新しい1軸の値zになる
    - formula: "w = \\arg\\max Var(w^T x)"
      explain: "向きwは「写したあとの散らばり（分散Var）がいちばん大きくなる向き」を選ぶ。散らばりが大きい＝データの違いをよく残せる向き。"
      result: 散らばり最大の向きが第1主成分
    - formula: "r = \\dfrac{\\lambda_1}{\\lambda_1 + \\lambda_2 + \\cdots}"
      explain: 各主成分の散らばりλを全部の合計で割ると、その軸が全体の何割を説明できるかが分かる。この割合 r が寄与率。
      example: "r = \\dfrac{\\lambda_1}{\\sum \\lambda} \\approx 0.7"
      result: 例えば第1主成分だけで全体の約70%を説明
difficulty: 中級
tags: ["次元削減", "可視化", "教師なし"]
keywords: ["主成分分析", "PCA", "次元削減", "圧縮", "可視化", "主成分", "寄与率"]
purposeCategories: ["次元を減らしたい", "グループ分けしたい", "要約したい"]
dataCategories: ["多次元データ"]
mathCategories: ["次元削減"]
formula: データのばらつき（分散）が最大になる方向を順に新しい軸（主成分）として取り出す
