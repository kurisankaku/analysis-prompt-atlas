# src/content/methods/median.yaml
name: 中央値
reading: ちゅうおうち
english: Median
summary: データを小さい順に並べたとき、ちょうど真ん中に来る値。
oneLiner: 大きさ順に並べて「まん中」に位置する値。外れ値に強い代表値。
analogy: 年収の高い人が数人いる集団で「真ん中の人の年収」を見るイメージ。一部の大金持ちに引っ張られない。
whatYouLearn: 極端な値の影響を受けにくい「代表的な真ん中」の水準が分かる。平均とズレていれば分布の偏りが見える。
suitableData:
  - 数値データ。特に外れ値や偏りがあるデータ（年収、価格など）
suitablePurposes:
  - 外れ値に左右されない代表値を知りたい
inputData: 1列の数値が並んだデータ。1行が1件に対応する。
sampleTable:
  caption: 例：5件の年収（万円）
  columns: ["人", "年収"]
  rows:
    - ["A", "300"]
    - ["B", "350"]
    - ["C", "400"]
    - ["D", "450"]
    - ["E", "5000"]
keyResults:
  - { label: 中央値, value: "400", unit: 万円, hint: 真ん中（3番目）の人 }
  - { label: 平均, value: "1300", unit: 万円, hint: 外れ値Eに引っ張られる }
sampleChart:
  type: bar
  caption: 外れ値Eで平均(黄)は1300に跳ね上がるが、中央値(ピンク)は400で実態に近い。
  x: { label: "人" }
  y: { label: "年収", unit: "万円" }
  categories: ["A", "B", "C", "D", "E"]
  series:
    - label: 年収
      color: water
      points: [[1, 300], [2, 350], [3, 400], [4, 450], [5, 5000]]
  referenceLines:
    - { axis: 'y', value: 400, label: "中央値", color: signal }
    - { axis: 'y', value: 1300, label: "平均", color: gold, dashed: true }
results: 真ん中に位置する1つの数値（この例では400）。平均（約1300）より実態に近い代表値になる。
howToRead: 中央値400・平均1300のように大きくズレるときは、一部の極端な大きい値が平均を押し上げているサイン。実感に近いのは中央値。
beforeAfter:
  before: 平均だけ見て「年収1300万が普通」と誤解しかねない。
  after: 中央値400を見て「多くの人は400前後」と実態をつかめる。
whenToUse:
  - 外れ値や偏りが大きいデータの代表値を示したいとき
  - 平均と比べて分布の偏りを確認したいとき
whenNotToUse:
  - 全データの合計や総量が重要なとき（中央値からは総量が出ない）
  - 左右対称でばらつきが小さいデータ（平均でほぼ十分）
cautions:
  - 合計・総量の情報は失われる。総額が知りたい用途には不向き。
  - データ件数が偶数のときは真ん中2つの平均を取る、という定義を意識する。
related:
  - id: mean
    type: 比較対象
    note: 外れ値に弱い代表値。中央値と併せて分布の偏りを判断する。
aiPromptExample: このデータの中央値を出し、平均との差から分布の偏り（外れ値の影響）を説明してください。
derivation:
  intro: 中央値は「小さい順に並べて、ちょうど真ん中の値を選ぶ」だけ。合計も割り算もいらない。
  symbols:
    - { sym: "x_{(k)}", meaning: "小さい順に並べたときk番目の値（カッコ付きは並べ替え後を表す）" }
    - { sym: "n", meaning: "データの個数（ここでは5件）" }
    - { sym: "\\mathrm{Med}", meaning: "中央値（メディアン）" }
  steps:
    - formula: "x_{(1)} \\le x_{(2)} \\le \\cdots \\le x_{(n)}"
      explain: まずデータを小さい順に並べる。並べ替えると「何番目が真ん中か」を位置で言えるようになる。
      example: "300 \\le 350 \\le 400 \\le 450 \\le 5000"
      result: 5件を小さい順に並べた
    - formula: "\\mathrm{Med} = x_{\\left(\\frac{n+1}{2}\\right)}"
      explain: 個数nが奇数なら、ちょうど真ん中の順位は(n+1)/2番目。その位置の値が中央値になる。
      example: "\\mathrm{Med} = x_{\\left(\\frac{5+1}{2}\\right)} = x_{(3)} = 400"
      result: 真ん中（3番目）は400万円
difficulty: 基礎
tags: ["基礎統計", "解釈しやすい", "少量データでも可"]
keywords: ["中央値", "median", "代表値", "ロバスト"]
purposeCategories: ["傾向を知りたい", "要約したい"]
dataCategories: ["数値データ"]
mathCategories: ["基礎統計"]
formula: 並べ替えたデータ x₍₁₎ ≤ … ≤ x₍ₙ₎ の中央位置の値
