# src/content/methods/multiple-regression.yaml
name: 重回帰分析
reading: じゅうかいきぶんせき
english: Multiple Linear Regression
summary: 複数の原因（説明変数）から結果を予測し、どの要因がどれだけ効いているかを調べる手法。
oneLiner: 「広告費・気温・立地…」など複数の原因をまとめて式にし、結果を予測する単回帰の拡張版。
analogy: お店の売上を「広告費＋気温＋駅からの距離」など複数の要因の足し算で説明するイメージ。それぞれが売上をどれだけ押し上げ/押し下げているかが分かる。
whatYouLearn: 複数の原因が結果に与える影響を同時に評価できる。「他の条件を一定にしたとき、この要因が1増えると結果がいくつ変わるか」が要因ごとに分かり、予測もできる。
suitableData:
  - 数値データ・多次元データ。1つの結果に対し、原因となる数値の列が複数あるもの
suitablePurposes:
  - 複数の要因の影響度を比べつつ結果を予測したい
inputData: 1つの目的変数(Y)と、複数の説明変数(X1, X2, …)の列を持つデータ。1行が1件に対応する。
sampleTable:
  caption: 例：店舗ごとの売上と要因
  columns: ["広告費(万円)", "気温(℃)", "駅距離(分)", "売上(万円)"]
  rows:
    - ["10", "25", "5", "120"]
    - ["20", "28", "3", "160"]
    - ["15", "20", "10", "100"]
    - ["25", "30", "2", "190"]
keyResults:
  - { label: 予測式, value: "売上=b0+3.5×広告費+1.2×気温−6.0×駅距離" }
  - { label: 最も効く要因, value: "駅距離（−6.0）", hint: 係数の絶対値が最大 }
sampleChart:
  type: bar
  caption: 係数の符号と大きさで各要因の効きを比較。
  categories: ["広告費", "気温", "駅距離"]
  x: { label: "要因" }
  y: { label: "係数（効きの大きさ）" }
  referenceLines:
    - { axis: y, value: 0, label: "ゼロ基準", color: line-strong, dashed: false }
  series:
    - label: 係数
      points: [[1, 3.5], [2, 1.2], [3, -6.0]]
results: 「売上 ＝ a1×広告費 ＋ a2×気温 ＋ a3×駅距離 ＋ b」という式と、各係数（要因ごとの効き具合）、当てはまりの良さ（自由度調整済みR²）。
howToRead: 各係数の符号と大きさで「その要因が結果を上げるか下げるか・どれだけ効くか」を読む。ただし変数同士の単位が違うと大きさの直接比較はできない点に注意。
beforeAfter:
  before: 売上に効く要因が複数あるのに、1つずつしか見られず全体像がつかめない。
  after: 「広告費と立地が特に効き、気温の影響は小さい」と要因を並べて評価し、予測式も得られる。
whenToUse:
  - 結果に複数の原因が同時に関わるとき
  - どの要因が効いているかを比べたいとき
whenNotToUse:
  - 原因が実質1つのとき（単回帰で十分）
  - 説明変数同士が強く相関しているとき（多重共線性で結果が不安定になる）
cautions:
  - 多重共線性に注意。説明変数同士が強く相関すると係数の解釈が不安定になる。
  - 変数を増やしすぎると過学習し、見かけのR²だけ上がる。自由度調整済みR²で見る。
  - 係数は「因果」ではなく相関的な関係。安易に原因と断定しない。
related:
  - id: simple-regression
    type: 前提
    note: 説明変数が1つの基本形。重回帰はその拡張。
  - id: random-forest
    type: 比較対象
    note: 直線で表せない複雑な関係や交互作用は木ベースの手法が得意。
  - id: correlation
    type: 前処理
    note: 事前に変数間の相関を見て多重共線性をチェックする。
aiPromptExample: このデータで重回帰分析を行い、各説明変数の係数と自由度調整済みR²を出し、多重共線性の懸念があれば指摘してください。
derivation:
  intro: 重回帰は単回帰の拡張で、原因（説明変数）を複数並べて足し算するだけ。各係数が「その要因がどれだけ効くか」を表す。
  symbols:
    - { sym: "\\hat{y}", meaning: "予測する結果の値（ここでは売上）" }
    - { sym: "x_1, x_2, \\ldots", meaning: "各説明変数（広告費・気温・駅距離など）" }
    - { sym: "b_1, b_2, \\ldots", meaning: "各係数（その要因の効きの大きさ）" }
    - { sym: "b_0", meaning: "切片（すべての要因が0のときの基準値）" }
  steps:
    - formula: "\\hat{y} = b_0 + b_1 x_1 + b_2 x_2 + \\cdots"
      explain: 各要因に係数をかけて全部足す。係数が正なら結果を上げ、負なら下げる。要因が1つなら単回帰と同じ形になる。
      result: 各要因の効きを足し合わせて結果を予測する
    - formula: "\\hat{y} = b_0 + 3.5 x_1 + 1.2 x_2 - 6.0 x_3"
      explain: 分析で得た係数を当てはめた式。広告費(x_1)は+3.5、気温(x_2)は+1.2、駅距離(x_3)は−6.0なので、駅から遠いほど売上が下がると読める。
      example: "\\hat{y} = b_0 + 3.5 \\times 20 + 1.2 \\times 28 - 6.0 \\times 3"
      result: 各要因の値を入れれば売上を予測できる
    - formula: "\\min \\sum (y - \\hat{y})^2"
      explain: 係数は「実際の値yと予測ŷのズレの2乗の合計」が最小になるように決める（最小二乗法）。要因が複数でも考え方は単回帰と同じ。
      result: 誤差の2乗和が最小になるよう全係数が決まる
difficulty: 中級
tags: ["回帰分析", "予測", "要因分析"]
keywords: ["重回帰分析", "multiple regression", "回帰", "説明変数", "多重共線性", "予測"]
purposeCategories: ["影響要因を知りたい", "予測したい"]
dataCategories: ["数値データ", "多次元データ"]
mathCategories: ["回帰分析"]
formula: Y = a₁X₁ + a₂X₂ + … + aₖXₖ + b
