# src/content/methods/decision-tree.yaml
name: 決定木
reading: けっていぎ
english: Decision Tree
summary: 「YESかNOか」の質問を枝分かれで重ねて、データを分類・予測する手法。
oneLiner: 質問を順にたどってグループ分けする、フローチャートのような分類・予測の手法。
analogy: 動物当てゲームで「鳥ですか？→はい」「飛べますか？→いいえ」と質問を重ねて答えに行き着くイメージ。枝をたどると分類結果に届く。
whatYouLearn: データを分けるための「質問のルール」が枝分かれの図で分かる。どの条件で結果が変わるかが目で見て分かり、新しいデータも枝をたどって分類・予測できる。
suitableData:
  - 数値データ・カテゴリデータが混在してもよい。結果がクラス（分類）や数値（予測）のもの
suitablePurposes:
  - 分かりやすいルールでデータを分類し、判断の決め手を知りたい
inputData: 説明変数（数値・カテゴリの列）と、分類・予測したい目的変数を持つデータ。1行が1件に対応する。
sampleTable:
  caption: 例：天気と来店有無
  columns: ["天気", "気温(℃)", "来店"]
  rows:
    - ["晴", "28", "来店"]
    - ["雨", "20", "不来店"]
    - ["晴", "15", "不来店"]
    - ["曇", "25", "来店"]
sampleChart:
  type: tree
  caption: 条件で枝分かれし、葉で分類が決まる。
  root:
    label: 天気は晴れ?
    children:
      - condition: はい
        label: 気温は22℃以上?
        children:
          - condition: はい
            leaf: 来店
            leafColor: good
          - condition: いいえ
            leaf: 不来店
            leafColor: signal
      - condition: いいえ
        leaf: 不来店
        leafColor: signal
results: 「天気は晴か？ → 気温は22℃以上か？ → 来店」のように枝分かれする木構造のルールと、各データの分類結果。
howToRead: 木の上ほど重要な質問（結果を大きく分ける条件）。枝を上からたどると、なぜそのクラスに分類されたかの理由がそのまま読める。
beforeAfter:
  before: どの条件で来店/不来店が分かれるのか、根拠を言葉で説明できない。
  after: 「晴かつ気温22℃以上なら来店」と、判断ルールを誰にでも説明できる形で示せる。
whenToUse:
  - 分類や予測の「判断理由」を分かりやすく示したいとき
  - 数値とカテゴリが混ざったデータを扱いたいとき
whenNotToUse:
  - 高い予測精度が最優先のとき（1本の木は不安定。ランダムフォレストが有利）
  - データが少なく、木が枝分かれを暗記してしまうとき
cautions:
  - 過学習しやすい。枝を深くしすぎると訓練データを丸暗記して新データに弱くなる。
  - データが少し変わると木の形が大きく変わり、結果が不安定になりやすい。
  - 枝の深さ（複雑さ）を適切に制限する（剪定）必要がある。
related:
  - id: random-forest
    type: 発展
    note: 1本の木の不安定さを、多数の木の多数決で克服したのがランダムフォレスト。
  - id: logistic-regression
    type: 比較対象
    note: 同じ分類でも、ロジスティック回帰は確率と式で表す。
  - id: knn
    type: 比較対象
    note: ルールで分けるか、近い仲間で分けるかという発想の違い。
aiPromptExample: このデータで決定木を作り、分類ルールを枝分かれで示し、過学習を防ぐための深さの目安も助言してください。
difficulty: 中級
tags: ["分類", "解釈しやすい", "ルールベース"]
keywords: ["決定木", "decision tree", "分類", "予測", "ルール", "過学習"]
purposeCategories: ["分類したい", "影響要因を知りたい"]
dataCategories: ["数値データ", "カテゴリデータ"]
mathCategories: ["分類"]
